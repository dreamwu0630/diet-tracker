<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飲食健康追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* 隱藏捲軸但保留滾動功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 簡單的進場動畫 */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-28">
    
    <!-- 頂部儀表板 -->
    <header class="pt-12 pb-8 px-6 bg-slate-900 text-white rounded-b-[2rem] shadow-lg relative overflow-hidden">
        <!-- 裝飾背景 -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 rounded-full bg-slate-800 opacity-50 blur-2xl"></div>
        
        <div class="relative z-10">
            <h1 class="text-2xl font-bold tracking-wide mb-1">今日概況</h1>
            <p class="text-slate-400 text-sm font-medium" id="current-date">載入中...</p>
            
            <div class="mt-8 flex justify-between items-end">
                <div>
                    <p class="text-sm text-slate-400 mb-1 font-medium">已攝取熱量</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-5xl font-black tracking-tight" id="total-cals">0</span>
                        <span class="text-sm text-slate-400 font-medium">/ 2000 kcal</span>
                    </div>
                </div>
            </div>

            <!-- 水分進度條 -->
            <div class="mt-8 bg-slate-800/50 rounded-2xl p-4 backdrop-blur-sm border border-slate-700/50">
                <div class="flex justify-between text-sm mb-3">
                    <span class="flex items-center gap-2 font-medium">
                        <div class="p-1 bg-blue-500/20 rounded-md">
                            <i class="ph-fill ph-drop text-blue-400"></i>
                        </div>
                        水分目標
                    </span>
                    <span id="water-text" class="text-slate-300 font-medium">0 / 2000 ml</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-3 inner-shadow">
                    <div class="bg-gradient-to-r from-blue-500 to-cyan-400 h-3 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(56,189,248,0.4)]" id="water-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- 快速紀錄區 -->
    <div class="px-6 py-8">
        <h2 class="text-xs font-bold text-slate-400 mb-4 tracking-widest uppercase">快速紀錄</h2>
        <div class="grid grid-cols-4 gap-3">
            <button onclick="openModal('meal', '早餐')" class="group flex flex-col items-center justify-center py-4 bg-orange-50 rounded-2xl text-orange-600 hover:bg-orange-100 transition-colors active:scale-95 border border-orange-100">
                <i class="ph-fill ph-coffee text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">早餐</span>
            </button>
            <button onclick="openModal('meal', '午餐')" class="group flex flex-col items-center justify-center py-4 bg-emerald-50 rounded-2xl text-emerald-600 hover:bg-emerald-100 transition-colors active:scale-95 border border-emerald-100">
                <i class="ph-fill ph-hamburger text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">午餐</span>
            </button>
            <button onclick="openModal('meal', '晚餐')" class="group flex flex-col items-center justify-center py-4 bg-indigo-50 rounded-2xl text-indigo-600 hover:bg-indigo-100 transition-colors active:scale-95 border border-indigo-100">
                <i class="ph-fill ph-bowl-food text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">晚餐</span>
            </button>
            <button onclick="addWater()" class="group flex flex-col items-center justify-center py-4 bg-blue-50 rounded-2xl text-blue-600 hover:bg-blue-100 transition-colors active:scale-95 border border-blue-100">
                <i class="ph-fill ph-drop text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">+250ml</span>
            </button>
        </div>
    </div>

    <!-- 歷史時間軸 -->
    <div class="px-6 pb-6">
        <h2 class="text-xs font-bold text-slate-400 mb-4 tracking-widest uppercase">今日時間軸</h2>
        <div id="timeline-container" class="space-y-4">
            <!-- 內容由 JS 動態生成 -->
        </div>
    </div>

    <!-- 懸浮新增按鈕 (作為備用或進階輸入) -->
    <div class="fixed bottom-0 w-full max-w-md bg-gradient-to-t from-white via-white to-transparent h-24 pointer-events-none z-10"></div>
    <button onclick="openModal('meal', '點心/其他')" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-14 h-14 bg-slate-900 text-white rounded-full shadow-[0_8px_20px_rgba(15,23,42,0.3)] flex items-center justify-center hover:bg-slate-800 transition-all active:scale-90 z-20 hover:shadow-lg">
        <i class="ph ph-plus text-2xl font-bold"></i>
    </button>
</div>

<!-- 輸入視窗 (Modal) -->
<div id="entry-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-10 sm:pb-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-100" id="modal-content">
        
        <!-- 頂部拉桿裝飾 (手機版常見) -->
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>

        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-800" id="modal-title">新增紀錄</h3>
            <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">
                <i class="ph ph-x font-bold"></i>
            </button>
        </div>
        
        <div class="space-y-5">
            <input type="hidden" id="entry-type" value="">
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">內容 <span class="text-red-500">*</span></label>
                <input type="text" id="entry-content" placeholder="例如：排骨便當、無糖綠茶" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">熱量預估 (kcal)</label>
                <input type="number" id="entry-cals" placeholder="選填，留空則為 0" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>

            <!-- 標籤快速選擇 -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">快速狀態標籤</label>
                <div class="flex flex-wrap gap-2" id="tag-container">
                    <button class="tag-btn px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="toggleTag(this)">外食</button>
                    <button class="tag-btn px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="toggleTag(this)">自己煮</button>
                    <button class="tag-btn px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="toggleTag(this)">太油膩</button>
                    <button class="tag-btn px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="toggleTag(this)">有飽足感</button>
                </div>
            </div>
            
            <button onclick="saveEntry()" class="w-full bg-slate-900 text-white font-bold rounded-xl px-4 py-4 mt-2 hover:bg-slate-800 active:scale-[0.98] transition-all shadow-md">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<script>
    // --- 狀態管理 ---
    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v2')) || [],
        selectedTags: []
    };

    const DAILY_WATER_GOAL = 2000;

    // --- 初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        updateDate();
        renderDashboard();
        renderTimeline();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    // --- 核心邏輯 ---
    function addWater() {
        const entry = {
            id: Date.now().toString(),
            type: 'water',
            title: '喝水',
            amount: 250,
            timestamp: new Date().toISOString(),
        };
        state.entries.unshift(entry);
        saveData();
        renderDashboard();
        renderTimeline();
        
        // 簡單震動回饋 (手機端)
        if (navigator.vibrate) { navigator.vibrate(50); }
    }

    function saveEntry() {
        const type = document.getElementById('entry-type').value;
        const content = document.getElementById('entry-content').value;
        const cals = parseInt(document.getElementById('entry-cals').value) || 0;

        if (!content && cals === 0) {
            // 簡易的防呆提示
            const inputField = document.getElementById('entry-content');
            inputField.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => inputField.classList.remove('border-red-500', 'bg-red-50'), 1500);
            return;
        }

        const entry = {
            id: Date.now().toString(),
            type: 'meal',
            category: type,
            title: content || type,
            calories: cals,
            tags: [...state.selectedTags],
            timestamp: new Date().toISOString(),
        };

        state.entries.unshift(entry);
        saveData();
        closeModal();
        renderDashboard();
        renderTimeline();
    }

    function deleteEntry(id) {
        if(confirm('確定要刪除這筆紀錄嗎？')) {
            state.entries = state.entries.filter(e => e.id !== id);
            saveData();
            renderDashboard();
            renderTimeline();
        }
    }

    function saveData() {
        localStorage.setItem('diet_entries_v2', JSON.stringify(state.entries));
    }

    // --- 渲染畫面 ---
    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        
        let totalCals = 0;
        let totalWater = 0;

        todayEntries.forEach(e => {
            if (e.type === 'meal') totalCals += (e.calories || 0);
            if (e.type === 'water') totalWater += (e.amount || 0);
        });

        // 數字動畫
        animateValue("total-cals", parseInt(document.getElementById('total-cals').textContent) || 0, totalCals, 500);
        
        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPercentage = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPercentage}%`;
    }

    // 數字跳動動畫
    function animateValue(id, start, end, duration) {
        if (start === end) return;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            document.getElementById(id).innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const today = new Date().toDateString();
        // 只顯示今天的紀錄
        const todayEntries = state.entries
            .filter(e => new Date(e.timestamp).toDateString() === today)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (todayEntries.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                    <i class="ph ph-note-blank text-4xl text-slate-300 mb-2"></i>
                    <p class="text-sm text-slate-400 font-medium">今天還沒開始紀錄喔</p>
                </div>`;
            return;
        }

        container.innerHTML = todayEntries.map((entry, index) => {
            const timeString = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            // 為新加入的項目加上進場動畫
            const animClass = index === 0 ? 'animate-slide-up' : '';
            
            if (entry.type === 'water') {
                return `
                <div class="flex items-start gap-4 p-4 bg-white border border-slate-100 rounded-2xl shadow-sm relative group ${animClass}">
                    <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0 text-blue-500">
                        <i class="ph-fill ph-drop text-2xl"></i>
                    </div>
                    <div class="flex-1 pt-0.5">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-slate-800 text-sm">喝水</h4>
                            <span class="text-xs font-medium text-slate-400">${timeString}</span>
                        </div>
                        <p class="text-blue-600 text-sm font-bold mt-1">+${entry.amount} ml</p>
                    </div>
                    <button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="ph-fill ph-trash"></i>
                    </button>
                </div>`;
            } else {
                // 餐點
                let icon = 'ph-bowl-food';
                let iconColor = 'text-indigo-500';
                let bgColor = 'bg-indigo-50';
                
                if (entry.category === '早餐') { icon = 'ph-coffee'; iconColor = 'text-orange-500'; bgColor = 'bg-orange-50'; }
                if (entry.category === '午餐') { icon = 'ph-hamburger'; iconColor = 'text-emerald-500'; bgColor = 'bg-emerald-50'; }
                if (entry.category === '點心/其他') { icon = 'ph-cookie'; iconColor = 'text-pink-500'; bgColor = 'bg-pink-50'; }

                const tagsHtml = (entry.tags && entry.tags.length > 0) 
                    ? `<div class="flex flex-wrap gap-1.5 mt-2.5">
                        ${entry.tags.map(t => `<span class="px-2 py-1 bg-slate-100 text-slate-600 rounded-md text-[11px] font-bold tracking-wide">${t}</span>`).join('')}
                       </div>` 
                    : '';

                return `
                <div class="flex items-start gap-4 p-4 bg-white border border-slate-100 rounded-2xl shadow-sm relative group ${animClass}">
                    <div class="w-12 h-12 rounded-xl ${bgColor} flex items-center justify-center flex-shrink-0 ${iconColor}">
                        <i class="ph-fill ${icon} text-2xl"></i>
                    </div>
                    <div class="flex-1 pt-0.5">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-slate-800 text-sm">${entry.category}</h4>
                            <span class="text-xs font-medium text-slate-400">${timeString}</span>
                        </div>
                        <p class="text-slate-600 text-sm font-medium leading-relaxed">${entry.title}</p>
                        ${tagsHtml}
                        ${entry.calories > 0 ? `<p class="text-slate-900 text-sm font-black mt-2 bg-slate-50 inline-block px-2 py-0.5 rounded">${entry.calories} kcal</p>` : ''}
                    </div>
                    <button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="ph-fill ph-trash"></i>
                    </button>
                </div>`;
            }
        }).join('');
    }

    // --- UI 互動控制 ---
    const modal = document.getElementById('entry-modal');
    const modalContent = document.getElementById('modal-content');

    function openModal(type, category) {
        document.getElementById('modal-title').textContent = `紀錄${category}`;
        document.getElementById('entry-type').value = category;
        document.getElementById('entry-content').value = '';
        document.getElementById('entry-cals').value = '';
        
        // 重置標籤
        state.selectedTags = [];
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.classList.remove('bg-slate-800', 'text-white', 'border-slate-800', 'shadow-sm');
            btn.classList.add('text-slate-600', 'border-slate-200');
        });

        modal.classList.remove('hidden');
        // 小小延遲以觸發動畫
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('translate-y-full');
            document.getElementById('entry-content').focus();
        }, 10);
    }

    function closeModal() {
        modal.classList.add('opacity-0');
        modalContent.classList.add('translate-y-full');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function toggleTag(btn) {
        const tagText = btn.textContent;
        const index = state.selectedTags.indexOf(tagText);
        
        if (index > -1) {
            // 移除標籤
            state.selectedTags.splice(index, 1);
            btn.classList.remove('bg-slate-800', 'text-white', 'border-slate-800', 'shadow-sm');
            btn.classList.add('text-slate-600', 'border-slate-200');
        } else {
            // 加入標籤
            state.selectedTags.push(tagText);
            btn.classList.remove('text-slate-600', 'border-slate-200');
            btn.classList.add('bg-slate-800', 'text-white', 'border-slate-800', 'shadow-sm');
        }
    }

    // 點擊背景關閉 Modal
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
</script>
</body>
</html>

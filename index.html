                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100">
                                <i class="ph ph-upload-simple text-slate-600 text-lg"></i>
                            </div>

<script>
    // 1. Firebase 初始化
    const firebaseConfig = {
        apiKey: "AIzaSyC263lrmHJICThOoMlR4JacvnIJJ6ExxzA",
        authDomain: "diet-tracker-20260819.firebaseapp.com",
        projectId: "diet-tracker-20260819",
        storageBucket: "diet-tracker-20260819.firebasestorage.app",
        messagingSenderId: "574990158319",
        appId: "1:574990158319:web:358b8326ec7b4809c7ce1a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v4')) || [], 
        scaleData: JSON.parse(localStorage.getItem('scale_entries_v2')) || [] 
    };
    const DAILY_WATER_GOAL = 2000;

    // 2. 雲端資料同步讀取函數
    async function syncFromFirebase() {
        try {
            const snapshot = await db.collection('diet_records').orderBy('createdAt', 'desc').get();
            const cloudData = [];
            
            snapshot.forEach(doc => {
                const data = doc.data();
                let timeStr = new Date().toISOString();
                if (data.createdAt) {
                    timeStr = data.createdAt.toDate().toISOString();
                }

                cloudData.push({
                    id: doc.id,
                    type: 'meal',
                    category: data.type || '晚餐', 
                    title: data.title || '未命名餐點',
                    calories: parseInt(data.calories) || 0,
                    protein: parseInt(data.protein) || 0,
                    analysis: data.analysis || '',
                    advice: data.advice || '',
                    context: 'LINE 同步',
                    timestamp: timeStr
                });
            });

            const combined = [...cloudData, ...state.entries];
            const uniqueEntries = Array.from(new Map(combined.map(item => [item.id, item])).values());
            
            state.entries = uniqueEntries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveData();
            renderDashboard();
            renderTimeline();
        } catch (error) {
            console.error("Firebase 讀取失敗:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if(state.entries.length === 0 && localStorage.getItem('diet_entries_v3')) {
            state.entries = JSON.parse(localStorage.getItem('diet_entries_v3'));
            saveData();
        }
        updateDate(); 
        renderDashboard(); 
        renderTimeline();
        renderScaleData();
        
        // 啟動 Firebase 雲端同步
        syncFromFirebase();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    function openScaleModal() {
        const m = document.getElementById('scale-modal');
        const c = document.getElementById('scale-modal-content');
        
        if (state.scaleData.length > 0) {
            const latest = state.scaleData[0];
            document.getElementById('input-weight').value = latest.weight || '';
            document.getElementById('input-fat').value = latest.fat || '';
            document.getElementById('input-waist').value = latest.waist || '';
        } else {
            document.getElementById('input-weight').value = '';
            document.getElementById('input-fat').value = '';
            document.getElementById('input-waist').value = '';
        }

        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }, 10);
    }

    function saveScaleData() {
        const weight = parseFloat(document.getElementById('input-weight').value);
        const fat = parseFloat(document.getElementById('input-fat').value);
        const waist = parseFloat(document.getElementById('input-waist').value);

        if (!weight && !fat && !waist) {
            closeModal('scale-modal', 'scale-modal-content');
            return;
        }

        const newScaleEntry = {
            id: 'scale_' + Date.now(),
            date: new Date().toISOString().split('T')[0],
            weight: weight || 0,
            fat: fat || 0,
            waist: waist || 0
        };

        const todayIndex = state.scaleData.findIndex(e => e.date === newScaleEntry.date);
        if (todayIndex !== -1) {
            state.scaleData[todayIndex] = newScaleEntry;
        } else {
            state.scaleData.unshift(newScaleEntry);
        }

        localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
        closeModal('scale-modal', 'scale-modal-content');
        renderScaleData();
    }

    function renderScaleData() {
        if (state.scaleData.length === 0) return;
        
        const latest = state.scaleData[0];
        document.getElementById('display-weight').textContent = latest.weight ? latest.weight : '-';
        document.getElementById('display-fat').textContent = latest.fat ? latest.fat + '%' : '-';
        document.getElementById('display-waist').textContent = latest.waist ? latest.waist : '-';
        
        const dateObj = new Date(latest.date);
        document.getElementById('scale-date').textContent = `最後更新：${dateObj.getMonth()+1}/${dateObj.getDate()}`;
    }

    function openDataModal() {
        const m = document.getElementById('data-modal');
        const c = document.getElementById('data-modal-content');
        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }, 10);
    }

    // 4. 支援 Firebase 雲端同步的 Markdown 匯入功能
    async function handleTextImport() {
        const text = document.getElementById('import-text').value;
        if (!text.trim()) { alert('請先貼上資料。'); return; }
        
        const batch = db.batch();
        let addedCount = 0; 
        let updatedCount = 0;
        const lines = text.split('\n');

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
            if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);
            
            let row = [];
            if (cleanLine.includes('|')) {
                row = cleanLine.split('|').map(s => s.trim());
            } else {
                const parsed = Papa.parse(cleanLine);
                if (parsed.data && parsed.data.length > 0) row = parsed.data[0].map(s => s.trim());
            }

            if (row.length < 3) return; 

            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                
                let category = '點心/其他'; let timeStr = '15:00';
                
                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }
                
                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                const content = row[2] || '未紀錄內容';
                
                let calories = 0, protein = 0, analysis = '', advice = '';
                
                if (row.length >= 7 && !isNaN(parseInt(row[3]))) {
                    calories = parseInt(row[3]) || 0;
                    protein = parseInt(row[4]) || 0;
                    analysis = row[5] || '';
                    advice = row[6] || '';
                } else {
                    analysis = row[3] || '';
                    advice = row[4] || '';
                }
                
                const newEntry = {
                    id: 'import_' + Date.now() + Math.random().toString(36).substring(7),
                    type: content.includes('水') && !content.includes('餃') && !content.includes('果') ? 'water' : 'meal',
                    category: category, 
                    title: content, 
                    calories: calories,
                    protein: protein,
                    analysis: analysis, 
                    advice: advice, 
                    timestamp: timestamp
                };

                const firebaseData = {
                    type: newEntry.category,
                    title: newEntry.title,
                    calories: newEntry.calories,
                    protein: newEntry.protein,
                    analysis: newEntry.analysis,
                    advice: newEntry.advice,
                    createdAt: firebase.firestore.Timestamp.fromDate(new Date(newEntry.timestamp))
                };

                const existingIndex = state.entries.findIndex(e => e.timestamp.startsWith(dateStr) && e.category === category && e.type === 'meal');

                if (existingIndex !== -1 && newEntry.type === 'meal') {
                    newEntry.id = state.entries[existingIndex].id;
                    state.entries[existingIndex] = newEntry; 
                    
                    const docRef = db.collection('diet_records').doc(newEntry.id);
                    batch.set(docRef, firebaseData, { merge: true });
                    updatedCount++;
                } else {
                    const docRef = db.collection('diet_records').doc(newEntry.id);
                    batch.set(docRef, firebaseData);
                    state.entries.push(newEntry); 
                    addedCount++;
                }
            }
        });
        
        if (addedCount > 0 || updatedCount > 0) {
            try {
                document.getElementById('import-text').value = '雲端同步中，請稍候...';
                await batch.commit();
                saveData();
                alert(`匯入與雲端同步完成！\n新增紀錄：${addedCount} 筆\n覆蓋更新舊紀錄：${updatedCount} 筆`);
                location.reload();
            } catch (error) {
                console.error("雲端批次寫入失敗:", error);
                alert("資料庫同步失敗，請確認網路狀態！");
            }
        } else {
            alert('沒有讀取到有效資料。');
        }
    }

    function exportData() {
        const backupData = { meals: state.entries, scale: state.scaleData };
        const dataStr = JSON.stringify(backupData, null, 2); 
        
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const exportFileDefaultName = `diet_backup_${new Date().toISOString().split('T')[0]}.json`;
        
        let linkElement = document.createElement('a');
        linkElement.setAttribute('href', url);
        linkElement.setAttribute('download', exportFileDefaultName);
        document.body.appendChild(linkElement); 
        linkElement.click();
        
        document.body.removeChild(linkElement);
        URL.revokeObjectURL(url); 
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(importedData.meals) {
                    state.entries = importedData.meals;
                    state.scaleData = importedData.scale || [];
                } else if (Array.isArray(importedData)) {
                    state.entries = importedData;
                }
                saveData();
                localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
                alert('備份還原成功！');
                location.reload();
            } catch (err) { alert('檔案格式錯誤。'); }
        };
        reader.readAsText(file);
    }

    function clearAllData() {
        if(confirm('警告：確定要刪除所有紀錄嗎？此動作無法復原。')) {
            state.entries = []; state.scaleData = [];
            saveData(); localStorage.removeItem('scale_entries_v2');
            location.reload();
        }
    }

    function addWater() {
        const entry = { id: Date.now().toString(), type: 'water', title: '喝水', amount: 250, timestamp: new Date().toISOString() };
        state.entries.unshift(entry); saveData(); renderDashboard(); renderTimeline();
        if (navigator.vibrate) { navigator.vibrate(50); }
    }

    function saveEntry() {
        const type = document.getElementById('entry-type').value;
        const content = document.getElementById('entry-content').value;
        const context = document.getElementById('entry-context').value;
        const cals = parseInt(document.getElementById('entry-cals').value) || 0;
        const protein = parseInt(document.getElementById('entry-protein').value) || 0;
        
        if (!content) {
            const inputField = document.getElementById('entry-content');
            inputField.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => inputField.classList.remove('border-red-500', 'bg-red-50'), 1500);
            return;
        }
        
        const entry = { 
            id: Date.now().toString(), 
            type: 'meal', 
            category: type, 
            title: content, 
            context: context, 
            calories: cals,
            protein: protein,
            timestamp: new Date().toISOString() 
        };
        state.entries.unshift(entry); saveData(); closeModal('entry-modal', 'modal-content'); renderDashboard(); renderTimeline();
    }

    // 3. 雲端同步刪除函數
    async function deleteEntry(id) {
        if(confirm('確定要刪除這筆紀錄嗎？')) {
            try {
                await db.collection('diet_records').doc(id).delete();
                state.entries = state.entries.filter(e => e.id !== id);
                saveData(); 
                renderDashboard(); 
                renderTimeline();
            } catch (error) {
                console.error("刪除失敗:", error);
                alert("雲端刪除失敗，請確認網路連線狀態");
            }
        }
    }

    function saveData() { localStorage.setItem('diet_entries_v4', JSON.stringify(state.entries)); }

    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        let totalWater = 0; let totalCals = 0; let totalProtein = 0;
        
        todayEntries.forEach(e => { 
            if (e.type === 'water') totalWater += (e.amount || 0); 
            if (e.type === 'meal') {
                totalCals += (e.calories || 0);
                totalProtein += (e.protein || 0);
            }
        });
        
        document.getElementById('total-cals').textContent = totalCals;
        document.getElementById('total-protein').textContent = totalProtein;

        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPercentage = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPercentage}%`;
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        
        const sortedEntries = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (sortedEntries.length === 0) {
            container.innerHTML = `<div class="text-center py-12 bg-slate-50 md:bg-white rounded-2xl border border-dashed border-slate-200"><i class="ph ph-note-blank text-4xl text-slate-300 mb-2"></i><p class="text-sm text-slate-400 font-medium">尚無紀錄，點擊左下角齒輪匯入資料</p></div>`;
            return;
        }

        function getWeekKey(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff)).getTime();
        }

        const weeks = new Map();

        sortedEntries.forEach((entry, index) => {
            const entryDate = new Date(entry.timestamp);
            const weekKey = getWeekKey(entryDate);
            const dateStr = entryDate.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
            
            if (!weeks.has(weekKey)) {
                weeks.set(weekKey, { totalCals: 0, totalProtein: 0, days: new Map(), start: weekKey });
            }
            
            const weekObj = weeks.get(weekKey);
            
            if (!weekObj.days.has(dateStr)) {
                weekObj.days.set(dateStr, { cals: 0, protein: 0, entries: [] });
            }
            
            const dayObj = weekObj.days.get(dateStr);
            dayObj.entries.push({ entry, index }); 
            
            if (entry.type === 'meal') {
                const cals = parseInt(entry.calories) || 0;
                const prot = parseInt(entry.protein) || 0;
                weekObj.totalCals += cals;
                weekObj.totalProtein += prot;
                dayObj.cals += cals;
                dayObj.protein += prot;
            }
        });

        let htmlContent = '';

        Array.from(weeks.values()).sort((a, b) => b.start - a.start).forEach(week => {
            
            const startDate = new Date(week.start);
            const endDate = new Date(week.start);
            endDate.setDate(endDate.getDate() + 6);
            const weekLabel = `${startDate.getMonth()+1}/${startDate.getDate()} - ${endDate.getMonth()+1}/${endDate.getDate()}`;
            
            htmlContent += `
            <div class="mb-4 mt-6 p-5 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl shadow-lg text-white relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-24 h-24 rounded-full bg-slate-700 opacity-50 blur-xl"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <i class="ph-fill ph-calendar-check text-indigo-400 text-lg"></i>
                            <h3 class="font-bold text-sm tracking-wide">當週累計</h3>
                        </div>
                        <span class="text-xs font-medium bg-slate-700/80 px-2 py-1 rounded-md text-slate-300">${weekLabel}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-slate-400 mb-1">熱量</p>
                            <p class="text-2xl font-bold">${week.totalCals} <span class="text-xs font-normal text-slate-400">kcal</span></p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">蛋白質</p>
                            <p class="text-2xl font-bold text-emerald-400">${week.totalProtein} <span class="text-xs font-normal text-slate-400">g</span></p>
                        </div>
                    </div>
                </div>
            </div>`;
            
            Array.from(week.days.entries()).forEach(([dateStr, day]) => {
                
                htmlContent += `
                <div class="flex justify-between items-center pt-4 pb-3 mb-2 border-b border-slate-100">
                    <span class="text-xs font-bold text-slate-500 bg-slate-200/60 px-3 py-1.5 rounded-full shadow-sm">${dateStr}</span>
                    <div class="flex gap-3 text-[12px] font-bold">
                        <span class="text-slate-700">${day.cals} <span class="text-[10px] font-normal text-slate-400">kcal</span></span>
                        <span class="text-emerald-600">${day.protein} <span class="text-[10px] font-normal text-slate-400">g</span></span>
                    </div>
                </div>`;
                
                day.entries.forEach(({ entry, index }) => {
                    const timeString = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                    const animClass = index === 0 ? 'animate-slide-up' : '';
                    
                    if (entry.type === 'water') {
                        htmlContent += `<div class="flex items-start gap-4 p-4 bg-white md:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm relative group mb-3 ${animClass}"><div class="w-12 h-12 rounded-xl bg-blue-100/50 flex items-center justify-center flex-shrink-0 text-blue-500"><i class="ph-fill ph-drop text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">喝水</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-blue-600 text-sm font-bold mt-1">+${entry.amount} ml</p></div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
                    } else {
                        let icon = 'ph-bowl-food', iconColor = 'text-indigo-500', bgColor = 'bg-indigo-100/50';
                        if (entry.category === '早餐') { icon = 'ph-coffee'; iconColor = 'text-orange-500'; bgColor = 'bg-orange-100/50'; }
                        if (entry.category === '午餐') { icon = 'ph-hamburger'; iconColor = 'text-emerald-500'; bgColor = 'bg-emerald-100/50'; }
                        if (entry.category === '宵夜') { icon = 'ph-moon-stars'; iconColor = 'text-purple-500'; bgColor = 'bg-purple-100/50'; }
                        
                        const contextHtml = entry.context ? `<span class="inline-block mt-3 mr-2 px-2.5 py-1 bg-white border border-slate-200 text-slate-600 rounded-md text-[11px] font-bold tracking-wide shadow-sm">📍 ${entry.context}</span>` : '';
                        
                        let nutritionHtml = '';
                        if (entry.calories > 0 || entry.protein > 0) {
                            nutritionHtml += `<div class="inline-flex gap-2 mt-3 align-middle">`;
                            if (entry.calories > 0) nutritionHtml += `<span class="px-2 py-1 bg-slate-800 text-white rounded-md text-[11px] font-bold tracking-wide shadow-sm">${entry.calories} kcal</span>`;
                            if (entry.protein > 0) nutritionHtml += `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-md text-[11px] font-bold tracking-wide shadow-sm">${entry.protein}g 蛋白</span>`;
                            nutritionHtml += `</div>`;
                        }
                        
                        let analysisHtml = '';
                        if (entry.analysis || entry.advice) {
                            analysisHtml = `<div class="mt-4 p-4 bg-white rounded-xl border-l-4 border-indigo-400 text-sm space-y-2 shadow-sm">`;
                            if (entry.analysis) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-indigo-600">衝擊分析：</strong>${entry.analysis}</p>`;
                            if (entry.advice) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-emerald-600">優化建議：</strong>${entry.advice}</p>`;
                            analysisHtml += `</div>`;
                        }

                        htmlContent += `<div class="flex items-start gap-4 p-4 bg-white md:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm relative group mb-3 hover:shadow-md transition-shadow ${animClass}"><div class="w-12 h-12 rounded-xl ${bgColor} flex items-center justify-center flex-shrink-0 ${iconColor}"><i class="ph-fill ${icon} text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">${entry.category}</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-slate-900 font-bold leading-relaxed text-base">${entry.title}</p><div>${contextHtml}${nutritionHtml}</div>${analysisHtml}</div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
                    }
                });
            });
        });
        
        container.innerHTML = htmlContent;
    }

    function openModal(type, category) {
        document.getElementById('modal-title').textContent = `紀錄${category}`;
        document.getElementById('entry-type').value = category;
        document.getElementById('entry-content').value = '';
        document.getElementById('entry-context').value = '';
        document.getElementById('entry-cals').value = '';
        document.getElementById('entry-protein').value = '';
        const m = document.getElementById('entry-modal'); const c = document.getElementById('modal-content');
        m.classList.remove('hidden'); setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); document.getElementById('entry-content').focus(); }, 10);
    }

    function closeModal(modalId, contentId) {
        const m = document.getElementById(modalId); const c = document.getElementById(contentId);
        m.classList.add('opacity-0'); c.classList.add('translate-y-full'); setTimeout(() => { m.classList.add('hidden'); }, 300);
    }

    document.getElementById('entry-modal').addEventListener('click', (e) => { if (e.target.id === 'entry-modal') closeModal('entry-modal', 'modal-content'); });
    document.getElementById('data-modal').addEventListener('click', (e) => { if (e.target.id === 'data-modal') closeModal('data-modal', 'data-modal-content'); });
    document.getElementById('scale-modal').addEventListener('click', (e) => { if (e.target.id === 'scale-modal') closeModal('scale-modal', 'scale-modal-content'); });
</script>

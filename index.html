<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飲食健康追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-28">
    
    <!-- 頂部儀表板 -->
    <header class="pt-12 pb-8 px-6 bg-slate-900 text-white rounded-b-[2rem] shadow-lg relative overflow-hidden">
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 rounded-full bg-slate-800 opacity-50 blur-2xl"></div>
        
        <div class="relative z-10">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold tracking-wide mb-1">今日概況</h1>
                    <p class="text-slate-400 text-sm font-medium" id="current-date">載入中...</p>
                </div>
                <!-- 資料管理按鈕 -->
                <button onclick="openDataModal()" class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition">
                    <i class="ph-fill ph-gear text-slate-300 text-xl"></i>
                </button>
            </div>
            
            <div class="mt-8 flex justify-between items-end">
                <div>
                    <p class="text-sm text-slate-400 mb-1 font-medium">追蹤重點</p>
                    <div class="flex items-baseline gap-1 mt-1">
                        <span class="text-xl font-bold tracking-tight text-white">控制碳水、留意脂肪肝</span>
                    </div>
                </div>
            </div>

            <!-- 水分進度條 (保留作為日常快速互動) -->
            <div class="mt-6 bg-slate-800/50 rounded-2xl p-4 backdrop-blur-sm border border-slate-700/50">
                <div class="flex justify-between text-sm mb-3">
                    <span class="flex items-center gap-2 font-medium">
                        <div class="p-1 bg-blue-500/20 rounded-md">
                            <i class="ph-fill ph-drop text-blue-400"></i>
                        </div>
                        水分目標
                    </span>
                    <span id="water-text" class="text-slate-300 font-medium">0 / 2000 ml</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-3 inner-shadow">
                    <div class="bg-gradient-to-r from-blue-500 to-cyan-400 h-3 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(56,189,248,0.4)]" id="water-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- 快速紀錄區 -->
    <div class="px-6 py-8">
        <h2 class="text-xs font-bold text-slate-400 mb-4 tracking-widest uppercase">快速紀錄</h2>
        <div class="grid grid-cols-4 gap-3">
            <button onclick="openModal('meal', '早餐')" class="group flex flex-col items-center justify-center py-4 bg-orange-50 rounded-2xl text-orange-600 hover:bg-orange-100 transition-colors active:scale-95 border border-orange-100">
                <i class="ph-fill ph-coffee text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">早餐</span>
            </button>
            <button onclick="openModal('meal', '午餐')" class="group flex flex-col items-center justify-center py-4 bg-emerald-50 rounded-2xl text-emerald-600 hover:bg-emerald-100 transition-colors active:scale-95 border border-emerald-100">
                <i class="ph-fill ph-hamburger text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">午餐</span>
            </button>
            <button onclick="openModal('meal', '晚餐')" class="group flex flex-col items-center justify-center py-4 bg-indigo-50 rounded-2xl text-indigo-600 hover:bg-indigo-100 transition-colors active:scale-95 border border-indigo-100">
                <i class="ph-fill ph-bowl-food text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">晚餐</span>
            </button>
            <button onclick="addWater()" class="group flex flex-col items-center justify-center py-4 bg-blue-50 rounded-2xl text-blue-600 hover:bg-blue-100 transition-colors active:scale-95 border border-blue-100">
                <i class="ph-fill ph-drop text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span class="text-xs font-bold">+250ml</span>
            </button>
        </div>
    </div>

    <!-- 歷史時間軸 -->
    <div class="px-6 pb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xs font-bold text-slate-400 tracking-widest uppercase">今日時間軸</h2>
            <!-- 簡單的日期切換提示，實務上可串接日曆套件 -->
            <span class="text-xs text-slate-400 font-medium bg-slate-100 px-2 py-1 rounded-md">僅顯示本日</span>
        </div>
        <div id="timeline-container" class="space-y-4">
            <!-- 內容由 JS 動態生成 -->
        </div>
    </div>

    <div class="fixed bottom-0 w-full max-w-md bg-gradient-to-t from-white via-white to-transparent h-24 pointer-events-none z-10"></div>
    <button onclick="openModal('meal', '宵夜/其他')" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-14 h-14 bg-slate-900 text-white rounded-full shadow-[0_8px_20px_rgba(15,23,42,0.3)] flex items-center justify-center hover:bg-slate-800 transition-all active:scale-90 z-20 hover:shadow-lg">
        <i class="ph ph-plus text-2xl font-bold"></i>
    </button>
</div>

<!-- 新增紀錄視窗 -->
<div id="entry-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-10 sm:pb-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-100" id="modal-content">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-800" id="modal-title">新增紀錄</h3>
            <button onclick="closeModal('entry-modal', 'modal-content')" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">
                <i class="ph ph-x font-bold"></i>
            </button>
        </div>
        <div class="space-y-5">
            <input type="hidden" id="entry-type" value="">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">內容 <span class="text-red-500">*</span></label>
                <input type="text" id="entry-content" placeholder="例如：麥當勞雞塊餐、半個奶酥菠蘿" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">情境標籤</label>
                <input type="text" id="entry-context" placeholder="例如：週末深夜放鬆、週末早晨" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>
            
            <button onclick="saveEntry()" class="w-full bg-slate-900 text-white font-bold rounded-xl px-4 py-4 mt-2 hover:bg-slate-800 active:scale-[0.98] transition-all shadow-md">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<!-- 資料管理視窗 (匯入/匯出) -->
<div id="data-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-10 sm:pb-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-100" id="data-modal-content">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-800">資料管理</h3>
            <button onclick="closeModal('data-modal', 'data-modal-content')" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">
                <i class="ph ph-x font-bold"></i>
            </button>
        </div>
        
        <div class="space-y-4">
            <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                <h4 class="font-bold text-blue-800 mb-2">1. 匯入舊紀錄 (CSV)</h4>
                <p class="text-xs text-blue-600 mb-3 leading-relaxed">請將你原本的「專屬飲食與代謝追蹤總表」直接下載為 CSV 並上傳。系統會自動略過表頭，精準抓取日期與分析建議。</p>
                <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleSpecificCSVImport(event)">
                <button onclick="document.getElementById('csv-upload').click()" class="w-full py-3 bg-white border border-blue-200 text-blue-700 font-bold rounded-lg hover:bg-blue-100 transition text-sm flex items-center justify-center gap-2">
                    <i class="ph-fill ph-upload-simple"></i> 選擇 CSV 檔案並匯入
                </button>
            </div>

            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <h4 class="font-bold text-slate-800 mb-2">2. 資料備份 (JSON)</h4>
                <p class="text-xs text-slate-500 mb-3 leading-relaxed">下載目前的全部紀錄，供日後換手機或換電腦時還原。</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportData()" class="py-3 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-700 transition text-sm">
                        匯出備份檔
                    </button>
                    <input type="file" id="json-upload" accept=".json" class="hidden" onchange="handleJSONImport(event)">
                    <button onclick="document.getElementById('json-upload').click()" class="py-3 bg-white border border-slate-300 text-slate-700 font-bold rounded-lg hover:bg-slate-100 transition text-sm">
                        還原備份
                    </button>
                </div>
            </div>
            
            <button onclick="clearAllData()" class="w-full py-3 mt-4 text-red-500 font-bold rounded-lg hover:bg-red-50 transition text-sm">
                清除所有資料
            </button>
        </div>
    </div>
</div>

<script>
    let state = {
        // 使用新的 key 避免與之前測試資料衝突
        entries: JSON.parse(localStorage.getItem('diet_entries_v3')) || []
    };
    const DAILY_WATER_GOAL = 2000;

    document.addEventListener('DOMContentLoaded', () => {
        updateDate(); renderDashboard(); renderTimeline();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    function openDataModal() {
        const m = document.getElementById('data-modal');
        const c = document.getElementById('data-modal-content');
        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }, 10);
    }

    // --- 客製化 CSV 解析邏輯 (專為使用者的總表設計) ---
    function handleSpecificCSVImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        Papa.parse(file, {
            complete: function(results) {
                let count = 0;
                
                results.data.forEach(row => {
                    // 防呆：確保該列有資料，且第一欄是字串
                    if (!row[0] || typeof row[0] !== 'string') return;
                    
                    // 核心邏輯：用正則表達式尋找以日期開頭的列 (例如 "2026/07/24 (五) 宵夜")
                    const dateMatch = row[0].match(/^(\d{4}\/\d{2}\/\d{2})/);
                    
                    if (dateMatch) {
                        const dateStr = dateMatch[1].replace(/\//g, '-'); // 轉成 YYYY-MM-DD
                        const fullDateString = row[0];
                        
                        // 判斷餐別與給予預設排序時間
                        let category = '點心/其他';
                        let timeStr = '15:00'; // 預設下午
                        
                        if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                        else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                        else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                        else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }
                        
                        const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                        
                        // 抓取其他欄位 (依照使用者表格結構)
                        const context = row[1] ? row[1].trim() : ''; // 情境
                        const content = row[2] ? row[2].trim() : '未紀錄內容'; // 內容
                        const analysis = row[3] ? row[3].trim() : ''; // 代謝衝擊分析
                        const advice = row[4] ? row[4].trim() : ''; // 修正建議
                        
                        // 若是單純喝水
                        if (content.includes('水') && !content.includes('餃') && !content.includes('果')) {
                             state.entries.push({
                                id: 'csv_' + Date.now() + Math.random(),
                                type: 'water', title: content, amount: 250, timestamp: timestamp
                            });
                        } else {
                            state.entries.push({
                                id: 'csv_' + Date.now() + Math.random(),
                                type: 'meal', 
                                category: category, 
                                title: content, 
                                context: context, // 存入情境
                                analysis: analysis, // 存入分析
                                advice: advice, // 存入建議
                                timestamp: timestamp
                            });
                        }
                        count++;
                    }
                });
                
                saveData();
                alert(`成功讀取並匯入 ${count} 筆紀錄！`);
                location.reload();
            }
        });
    }

    function exportData() {
        const dataStr = JSON.stringify(state.entries);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const exportFileDefaultName = `diet_backup_${new Date().toISOString().split('T')[0]}.json`;
        let linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(Array.isArray(importedData)) {
                    state.entries = importedData;
                    saveData();
                    alert('備份還原成功！');
                    location.reload();
                }
            } catch (err) { alert('檔案格式錯誤。'); }
        };
        reader.readAsText(file);
    }

    function clearAllData() {
        if(confirm('警告：確定要刪除所有紀錄嗎？此動作無法復原。')) {
            state.entries = [];
            saveData();
            location.reload();
        }
    }

    function addWater() {
        const entry = { id: Date.now().toString(), type: 'water', title: '喝水', amount: 250, timestamp: new Date().toISOString() };
        state.entries.unshift(entry); saveData(); renderDashboard(); renderTimeline();
        if (navigator.vibrate) { navigator.vibrate(50); }
    }

    function saveEntry() {
        const type = document.getElementById('entry-type').value;
        const content = document.getElementById('entry-content').value;
        const context = document.getElementById('entry-context').value;
        
        if (!content) {
            const inputField = document.getElementById('entry-content');
            inputField.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => inputField.classList.remove('border-red-500', 'bg-red-50'), 1500);
            return;
        }
        
        const entry = { 
            id: Date.now().toString(), 
            type: 'meal', 
            category: type, 
            title: content,
            context: context,
            timestamp: new Date().toISOString() 
        };
        state.entries.unshift(entry); 
        saveData(); 
        closeModal('entry-modal', 'modal-content'); 
        renderDashboard(); 
        renderTimeline();
    }

    function deleteEntry(id) {
        if(confirm('確定要刪除這筆紀錄嗎？')) {
            state.entries = state.entries.filter(e => e.id !== id);
            saveData(); renderDashboard(); renderTimeline();
        }
    }

    function saveData() { localStorage.setItem('diet_entries_v3', JSON.stringify(state.entries)); }

    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        let totalWater = 0;
        todayEntries.forEach(e => {
            if (e.type === 'water') totalWater += (e.amount || 0);
        });
        
        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPercentage = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPercentage}%`;
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        // 為了展示匯入資料，這裡暫時改為顯示「全部紀錄」並以日期分組，實務上可做日期切換
        const sortedEntries = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (sortedEntries.length === 0) {
            container.innerHTML = `<div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200"><i class="ph ph-note-blank text-4xl text-slate-300 mb-2"></i><p class="text-sm text-slate-400 font-medium">尚無紀錄，點擊右上角齒輪匯入舊資料</p></div>`;
            return;
        }

        let currentRenderedDate = '';
        let htmlContent = '';

        sortedEntries.forEach((entry, index) => {
            const entryDate = new Date(entry.timestamp).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
            
            // 遇到新的一天，加入日期分隔線
            if (entryDate !== currentRenderedDate) {
                htmlContent += `<div class="pt-4 pb-2"><span class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">${entryDate}</span></div>`;
                currentRenderedDate = entryDate;
            }

            const timeString = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            const animClass = index === 0 ? 'animate-slide-up' : '';
            
            if (entry.type === 'water') {
                htmlContent += `<div class="flex items-start gap-4 p-4 bg-white border border-slate-100 rounded-2xl shadow-sm relative group mb-3 ${animClass}"><div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0 text-blue-500"><i class="ph-fill ph-drop text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">喝水</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-blue-600 text-sm font-bold mt-1">+${entry.amount} ml</p></div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
            } else {
                let icon = 'ph-bowl-food', iconColor = 'text-indigo-500', bgColor = 'bg-indigo-50';
                if (entry.category === '早餐') { icon = 'ph-coffee'; iconColor = 'text-orange-500'; bgColor = 'bg-orange-50'; }
                if (entry.category === '午餐') { icon = 'ph-hamburger'; iconColor = 'text-emerald-500'; bgColor = 'bg-emerald-50'; }
                if (entry.category === '宵夜') { icon = 'ph-moon-stars'; iconColor = 'text-purple-500'; bgColor = 'bg-purple-50'; }
                
                const contextHtml = entry.context ? `<span class="inline-block mt-2 px-2 py-1 bg-slate-100 text-slate-600 rounded-md text-[11px] font-bold tracking-wide border border-slate-200">📍 ${entry.context}</span>` : '';
                
                // 渲染從 CSV 讀進來的 AI 分析與建議區塊
                let analysisHtml = '';
                if (entry.analysis || entry.advice) {
                    analysisHtml = `<div class="mt-3 p-3 bg-slate-50 rounded-xl border-l-4 border-indigo-400 text-sm space-y-2">`;
                    if (entry.analysis) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-indigo-600">衝擊分析：</strong>${entry.analysis}</p>`;
                    if (entry.advice) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-emerald-600">優化建議：</strong>${entry.advice}</p>`;
                    analysisHtml += `</div>`;
                }

                htmlContent += `<div class="flex items-start gap-4 p-4 bg-white border border-slate-100 rounded-2xl shadow-sm relative group mb-3 ${animClass}"><div class="w-12 h-12 rounded-xl ${bgColor} flex items-center justify-center flex-shrink-0 ${iconColor}"><i class="ph-fill ${icon} text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">${entry.category}</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-slate-900 font-bold leading-relaxed text-base">${entry.title}</p>${contextHtml}${analysisHtml}</div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
            }
        });
        
        container.innerHTML = htmlContent;
    }

    function openModal(type, category) {
        document.getElementById('modal-title').textContent = `紀錄${category}`;
        document.getElementById('entry-type').value = category;
        document.getElementById('entry-content').value = '';
        document.getElementById('entry-context').value = '';
        
        const m = document.getElementById('entry-modal');
        const c = document.getElementById('modal-content');
        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); document.getElementById('entry-content').focus(); }, 10);
    }

    function closeModal(modalId, contentId) {
        const m = document.getElementById(modalId);
        const c = document.getElementById(contentId);
        m.classList.add('opacity-0'); c.classList.add('translate-y-full');
        setTimeout(() => { m.classList.add('hidden'); }, 300);
    }

    document.getElementById('entry-modal').addEventListener('click', (e) => { if (e.target.id === 'entry-modal') closeModal('entry-modal', 'modal-content'); });
    document.getElementById('data-modal').addEventListener('click', (e) => { if (e.target.id === 'data-modal') closeModal('data-modal', 'data-modal-content'); });
</script>
</body>
</html>

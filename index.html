<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飲食健康追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

<div class="max-w-6xl mx-auto min-h-screen relative md:p-6 lg:p-8 flex flex-col md:flex-row gap-6 lg:gap-10 pb-28 md:pb-8">
    
    <!-- 左側欄 -->
    <div class="w-full md:w-80 lg:w-[400px] flex-shrink-0 md:sticky md:top-8 h-fit space-y-6">
        <header class="pt-12 pb-8 px-6 bg-slate-900 text-white rounded-b-[2rem] md:rounded-[2rem] shadow-lg relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 rounded-full bg-slate-800 opacity-50 blur-2xl"></div>
            
            <div class="relative z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-2xl font-bold tracking-wide mb-1">今日概況</h1>
                        <p class="text-slate-400 text-sm font-medium" id="current-date">載入中...</p>
                    </div>
                    <button onclick="openDataModal()" class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition">
                        <i class="ph-fill ph-gear text-slate-300 text-xl"></i>
                    </button>
                </div>
                
                <div class="mt-8 flex justify-between items-end">
                    <div>
                        <p class="text-sm text-slate-400 mb-1 font-medium">追蹤重點</p>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span class="text-xl font-bold tracking-tight text-white leading-tight">控制碳水、留意脂肪肝</span>
                        </div>
                    </div>
                </div>

                <div class="mt-6 bg-slate-800/50 rounded-2xl p-4 backdrop-blur-sm border border-slate-700/50">
                    <div class="flex justify-between text-sm mb-3">
                        <span class="flex items-center gap-2 font-medium">
                            <div class="p-1 bg-blue-500/20 rounded-md">
                                <i class="ph-fill ph-drop text-blue-400"></i>
                            </div>
                            水分目標
                        </span>
                        <span id="water-text" class="text-slate-300 font-medium">0 / 2000 ml</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-3 inner-shadow">
                        <div class="bg-gradient-to-r from-blue-500 to-cyan-400 h-3 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(56,189,248,0.4)]" id="water-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="px-6 py-2 md:px-0 md:bg-transparent">
            <h2 class="text-xs font-bold text-slate-400 mb-4 tracking-widest uppercase md:px-2">快速紀錄</h2>
            <div class="grid grid-cols-4 md:grid-cols-2 gap-3">
                <button onclick="openModal('meal', '早餐')" class="group flex flex-col items-center justify-center py-4 bg-orange-50 rounded-2xl text-orange-600 hover:bg-orange-100 transition-colors active:scale-95 border border-orange-100 shadow-sm">
                    <i class="ph-fill ph-coffee text-2xl mb-2 md:text-3xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold md:text-sm">早餐</span>
                </button>
                <button onclick="openModal('meal', '午餐')" class="group flex flex-col items-center justify-center py-4 bg-emerald-50 rounded-2xl text-emerald-600 hover:bg-emerald-100 transition-colors active:scale-95 border border-emerald-100 shadow-sm">
                    <i class="ph-fill ph-hamburger text-2xl mb-2 md:text-3xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold md:text-sm">午餐</span>
                </button>
                <button onclick="openModal('meal', '晚餐')" class="group flex flex-col items-center justify-center py-4 bg-indigo-50 rounded-2xl text-indigo-600 hover:bg-indigo-100 transition-colors active:scale-95 border border-indigo-100 shadow-sm">
                    <i class="ph-fill ph-bowl-food text-2xl mb-2 md:text-3xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold md:text-sm">晚餐</span>
                </button>
                <button onclick="addWater()" class="group flex flex-col items-center justify-center py-4 bg-blue-50 rounded-2xl text-blue-600 hover:bg-blue-100 transition-colors active:scale-95 border border-blue-100 shadow-sm">
                    <i class="ph-fill ph-drop text-2xl mb-2 md:text-3xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold md:text-sm">+250ml</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側欄 -->
    <div class="flex-1 w-full px-6 md:px-8 md:py-8 md:bg-white md:rounded-[2rem] md:shadow-sm md:border md:border-slate-100 min-h-[80vh]">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xs font-bold text-slate-400 tracking-widest uppercase">時間軸紀錄</h2>
            <span class="text-xs text-slate-400 font-medium bg-slate-100 px-3 py-1.5 rounded-md">全部紀錄</span>
        </div>
        <div id="timeline-container" class="space-y-4">
            <!-- 動態生成 -->
        </div>
    </div>

    <div class="fixed bottom-0 w-full md:hidden bg-gradient-to-t from-[#f8fafc] via-[#f8fafc] to-transparent h-24 pointer-events-none z-10"></div>
    <button onclick="openModal('meal', '宵夜/其他')" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 w-14 h-14 md:w-16 md:h-16 bg-slate-900 text-white rounded-full shadow-[0_8px_20px_rgba(15,23,42,0.3)] flex items-center justify-center hover:bg-slate-800 transition-all active:scale-90 z-20 hover:shadow-lg">
        <i class="ph ph-plus text-2xl md:text-3xl font-bold"></i>
    </button>
</div>

<!-- 新增紀錄 Modal -->
<div id="entry-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-10 sm:pb-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-100" id="modal-content">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-800" id="modal-title">新增紀錄</h3>
            <button onclick="closeModal('entry-modal', 'modal-content')" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">
                <i class="ph ph-x font-bold"></i>
            </button>
        </div>
        <div class="space-y-5">
            <input type="hidden" id="entry-type" value="">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">內容 <span class="text-red-500">*</span></label>
                <input type="text" id="entry-content" placeholder="例如：麥當勞雞塊餐、半個奶酥菠蘿" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">情境標籤</label>
                <input type="text" id="entry-context" placeholder="例如：週末深夜放鬆、週末早晨" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-slate-900 focus:border-transparent block p-3.5 outline-none transition-all placeholder:text-slate-400 font-medium">
            </div>
            
            <button onclick="saveEntry()" class="w-full bg-slate-900 text-white font-bold rounded-xl px-4 py-4 mt-2 hover:bg-slate-800 active:scale-[0.98] transition-all shadow-md">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<!-- 資料管理 Modal (全新 UI) -->
<div id="data-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md md:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-10 sm:pb-8 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-100 overflow-y-auto max-h-[90vh]" id="data-modal-content">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-800">資料管理</h3>
            <button onclick="closeModal('data-modal', 'data-modal-content')" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition-colors">
                <i class="ph ph-x font-bold"></i>
            </button>
        </div>
        
        <div class="space-y-6">
            
            <!-- 核心功能區：增量更新 -->
            <div>
                <div class="flex items-center gap-2 mb-1.5">
                    <i class="ph-fill ph-magic-wand text-indigo-500 text-lg"></i>
                    <h4 class="font-bold text-slate-800">AI 紀錄同步</h4>
                </div>
                <p class="text-xs text-slate-500 mb-3 leading-relaxed">貼上 Gemini 產出的 Markdown 表格，系統將自動比對並增量更新，不影響既有歷史資料。</p>
                <textarea id="import-text" rows="4" class="w-full p-4 text-sm bg-slate-50 border border-slate-200 rounded-xl mb-3 focus:ring-2 focus:ring-slate-900 outline-none placeholder:text-slate-400 transition-all resize-none" placeholder="在此貼上表格內容..."></textarea>
                <button onclick="handleTextImport()" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2">
                    執行同步更新
                </button>
            </div>

            <hr class="border-slate-100">

            <!-- 次要功能區：備份與還原 -->
            <div>
                <h4 class="text-[11px] font-bold text-slate-400 mb-3 tracking-widest uppercase">進階選項</h4>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportData()" class="py-2.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-colors text-sm flex justify-center items-center gap-1.5 shadow-sm">
                        <i class="ph ph-download-simple"></i> 匯出備份
                    </button>
                    <input type="file" id="json-upload" accept=".json" class="hidden" onchange="handleJSONImport(event)">
                    <button onclick="document.getElementById('json-upload').click()" class="py-2.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-colors text-sm flex justify-center items-center gap-1.5 shadow-sm">
                        <i class="ph ph-upload-simple"></i> 還原備份
                    </button>
                </div>
                
                <!-- 邊緣功能區：幽靈按鈕設計 -->
                <div class="mt-4 flex gap-3">
                     <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleSpecificCSVImport(event)">
                     <button onclick="document.getElementById('csv-upload').click()" class="flex-1 py-2 text-slate-400 hover:text-slate-700 hover:bg-slate-50 rounded-lg transition-colors text-xs font-medium text-center">
                         匯入舊版 CSV 檔
                     </button>
                     <button onclick="clearAllData()" class="flex-1 py-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors text-xs font-medium text-center">
                         清空所有資料
                     </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v3')) || []
    };
    const DAILY_WATER_GOAL = 2000;

    document.addEventListener('DOMContentLoaded', () => {
        updateDate(); renderDashboard(); renderTimeline();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    function openDataModal() {
        const m = document.getElementById('data-modal');
        const c = document.getElementById('data-modal-content');
        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }, 10);
    }

    // --- 全新增量更新 (Upsert) 邏輯 ---
    function handleTextImport() {
        const text = document.getElementById('import-text').value;
        if (!text.trim()) {
            alert('請先貼上資料。');
            return;
        }
        
        let addedCount = 0;
        let updatedCount = 0;
        const lines = text.split('\n');

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
            if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);
            
            let row = [];
            if (cleanLine.includes('|')) {
                row = cleanLine.split('|').map(s => s.trim());
            } else {
                const parsed = Papa.parse(cleanLine);
                if (parsed.data && parsed.data.length > 0) row = parsed.data[0].map(s => s.trim());
            }

            if (row.length < 3) return; 

            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                
                let category = '點心/其他';
                let timeStr = '15:00';
                
                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }
                
                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                
                const context = row[1] || '';
                const content = row[2] || '未紀錄內容';
                const analysis = row[3] || '';
                const advice = row[4] || '';
                
                const newEntry = {
                    id: 'import_' + Date.now() + Math.random(),
                    type: content.includes('水') && !content.includes('餃') && !content.includes('果') ? 'water' : 'meal',
                    category: category, 
                    title: content, 
                    context: context, 
                    analysis: analysis, 
                    advice: advice, 
                    amount: content.includes('水') ? 250 : undefined,
                    timestamp: timestamp
                };

                const existingIndex = state.entries.findIndex(e => 
                    e.timestamp.startsWith(dateStr) && e.category === category
                );

                if (existingIndex !== -1) {
                    newEntry.id = state.entries[existingIndex].id;
                    state.entries[existingIndex] = newEntry;
                    updatedCount++;
                } else {
                    state.entries.push(newEntry);
                    addedCount++;
                }
            }
        });
        
        if (addedCount > 0 || updatedCount > 0) {
            saveData();
            alert(`匯入完成！\n新增紀錄：${addedCount} 筆\n更新舊紀錄：${updatedCount} 筆`);
            location.reload();
        } else {
            alert('沒有讀取到有效資料，請確保貼上的是完整的 Markdown 表格或包含日期的資料。');
        }
    }

    // --- 客製化 CSV 檔案解析邏輯 ---
    function handleSpecificCSVImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const validLines = text.split('\n').filter(line => line.trim().match(/^\d{4}\/\d{2}\/\d{2}/));
            if (validLines.length === 0) {
                alert('找不到符合格式的紀錄，請確認 CSV 內容。');
                return;
            }
            Papa.parse(validLines.join('\n'), {
                complete: function(results) {
                    processParsedDataCSVMode(results.data);
                }
            });
        };
        reader.readAsText(file);
    }

    function processParsedDataCSVMode(dataRows) {
        let count = 0;
        let newEntries = []; 
        
        dataRows.forEach(row => {
            if (!row[0] || typeof row[0] !== 'string') return;
            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                
                let category = '點心/其他';
                let timeStr = '15:00';
                
                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }
                
                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                
                const context = row[1] ? row[1].trim() : '';
                const content = row[2] ? row[2].trim() : '未紀錄內容';
                const analysis = row[3] ? row[3].trim() : '';
                const advice = row[4] ? row[4].trim() : '';
                
                if (content.includes('水') && !content.includes('餃') && !content.includes('果')) {
                     newEntries.push({
                        id: 'import_' + Date.now() + Math.random(),
                        type: 'water', title: content, amount: 250, timestamp: timestamp
                    });
                } else {
                    newEntries.push({
                        id: 'import_' + Date.now() + Math.random(),
                        type: 'meal', 
                        category: category, 
                        title: content, 
                        context: context, 
                        analysis: analysis, 
                        advice: advice, 
                        timestamp: timestamp
                    });
                }
                count++;
            }
        });
        
        if (count > 0) {
            state.entries = newEntries;
            saveData();
            alert(`成功過濾並匯入 ${count} 筆紀錄！(舊資料已自動清除)`);
            location.reload();
        } else {
            alert('沒有讀取到有效資料，請檢查貼上的內容格式。');
        }
    }

    function exportData() {
        const dataStr = JSON.stringify(state.entries);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const exportFileDefaultName = `diet_backup_${new Date().toISOString().split('T')[0]}.json`;
        let linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(Array.isArray(importedData)) {
                    state.entries = importedData;
                    saveData();
                    alert('備份還原成功！');
                    location.reload();
                }
            } catch (err) { alert('檔案格式錯誤。'); }
        };
        reader.readAsText(file);
    }

    function clearAllData() {
        if(confirm('警告：確定要刪除所有紀錄嗎？此動作無法復原。')) {
            state.entries = [];
            saveData();
            location.reload();
        }
    }

    function addWater() {
        const entry = { id: Date.now().toString(), type: 'water', title: '喝水', amount: 250, timestamp: new Date().toISOString() };
        state.entries.unshift(entry); saveData(); renderDashboard(); renderTimeline();
        if (navigator.vibrate) { navigator.vibrate(50); }
    }

    function saveEntry() {
        const type = document.getElementById('entry-type').value;
        const content = document.getElementById('entry-content').value;
        const context = document.getElementById('entry-context').value;
        
        if (!content) {
            const inputField = document.getElementById('entry-content');
            inputField.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => inputField.classList.remove('border-red-500', 'bg-red-50'), 1500);
            return;
        }
        
        const entry = { 
            id: Date.now().toString(), 
            type: 'meal', 
            category: type, 
            title: content,
            context: context,
            timestamp: new Date().toISOString() 
        };
        state.entries.unshift(entry); 
        saveData(); 
        closeModal('entry-modal', 'modal-content'); 
        renderDashboard(); 
        renderTimeline();
    }

    function deleteEntry(id) {
        if(confirm('確定要刪除這筆紀錄嗎？')) {
            state.entries = state.entries.filter(e => e.id !== id);
            saveData(); renderDashboard(); renderTimeline();
        }
    }

    function saveData() { localStorage.setItem('diet_entries_v3', JSON.stringify(state.entries)); }

    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        let totalWater = 0;
        todayEntries.forEach(e => {
            if (e.type === 'water') totalWater += (e.amount || 0);
        });
        
        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPercentage = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPercentage}%`;
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const sortedEntries = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (sortedEntries.length === 0) {
            container.innerHTML = `<div class="text-center py-12 bg-slate-50 md:bg-white rounded-2xl border border-dashed border-slate-200"><i class="ph ph-note-blank text-4xl text-slate-300 mb-2"></i><p class="text-sm text-slate-400 font-medium">尚無紀錄，點擊左上角齒輪匯入資料</p></div>`;
            return;
        }

        let currentRenderedDate = '';
        let htmlContent = '';

        sortedEntries.forEach((entry, index) => {
            const entryDate = new Date(entry.timestamp).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
            
            if (entryDate !== currentRenderedDate) {
                htmlContent += `<div class="pt-6 pb-3"><span class="text-xs font-bold text-slate-500 bg-slate-200/60 px-3 py-1.5 rounded-full shadow-sm">${entryDate}</span></div>`;
                currentRenderedDate = entryDate;
            }

            const timeString = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            const animClass = index === 0 ? 'animate-slide-up' : '';
            
            if (entry.type === 'water') {
                htmlContent += `<div class="flex items-start gap-4 p-4 bg-white md:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm relative group mb-4 ${animClass}"><div class="w-12 h-12 rounded-xl bg-blue-100/50 flex items-center justify-center flex-shrink-0 text-blue-500"><i class="ph-fill ph-drop text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">喝水</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-blue-600 text-sm font-bold mt-1">+${entry.amount} ml</p></div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
            } else {
                let icon = 'ph-bowl-food', iconColor = 'text-indigo-500', bgColor = 'bg-indigo-100/50';
                if (entry.category === '早餐') { icon = 'ph-coffee'; iconColor = 'text-orange-500'; bgColor = 'bg-orange-100/50'; }
                if (entry.category === '午餐') { icon = 'ph-hamburger'; iconColor = 'text-emerald-500'; bgColor = 'bg-emerald-100/50'; }
                if (entry.category === '宵夜') { icon = 'ph-moon-stars'; iconColor = 'text-purple-500'; bgColor = 'bg-purple-100/50'; }
                
                const contextHtml = entry.context ? `<span class="inline-block mt-3 px-2.5 py-1 bg-white border border-slate-200 text-slate-600 rounded-md text-[11px] font-bold tracking-wide shadow-sm">📍 ${entry.context}</span>` : '';
                
                let analysisHtml = '';
                if (entry.analysis || entry.advice) {
                    analysisHtml = `<div class="mt-4 p-4 bg-white rounded-xl border-l-4 border-indigo-400 text-sm space-y-2 shadow-sm">`;
                    if (entry.analysis) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-indigo-600">衝擊分析：</strong>${entry.analysis}</p>`;
                    if (entry.advice) analysisHtml += `<p class="text-slate-700 leading-relaxed"><strong class="text-emerald-600">優化建議：</strong>${entry.advice}</p>`;
                    analysisHtml += `</div>`;
                }

                htmlContent += `<div class="flex items-start gap-4 p-4 bg-white md:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm relative group mb-4 ${animClass} hover:shadow-md transition-shadow"><div class="w-12 h-12 rounded-xl ${bgColor} flex items-center justify-center flex-shrink-0 ${iconColor}"><i class="ph-fill ${icon} text-2xl"></i></div><div class="flex-1 pt-0.5"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-slate-800 text-sm">${entry.category}</h4><span class="text-xs font-medium text-slate-400">${timeString}</span></div><p class="text-slate-900 font-bold leading-relaxed text-base">${entry.title}</p>${contextHtml}${analysisHtml}</div><button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-trash"></i></button></div>`;
            }
        });
        
        container.innerHTML = htmlContent;
    }

    function openModal(type, category) {
        document.getElementById('modal-title').textContent = `紀錄${category}`;
        document.getElementById('entry-type').value = category;
        document.getElementById('entry-content').value = '';
        document.getElementById('entry-context').value = '';
        
        const m = document.getElementById('entry-modal');
        const c = document.getElementById('modal-content');
        m.classList.remove('hidden');
        setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); document.getElementById('entry-content').focus(); }, 10);
    }

    function closeModal(modalId, contentId) {
        const m = document.getElementById(modalId);
        const c = document.getElementById(contentId);
        m.classList.add('opacity-0'); c.classList.add('translate-y-full');
        setTimeout(() => { m.classList.add('hidden'); }, 300);
    }

    document.getElementById('entry-modal').addEventListener('click', (e) => { if (e.target.id === 'entry-modal') closeModal('entry-modal', 'modal-content'); });
    document.getElementById('data-modal').addEventListener('click', (e) => { if (e.target.id === 'data-modal') closeModal('data-modal', 'data-modal-content'); });
</script>
</body>
</html>

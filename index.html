<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的日常飲食手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FBF9F5',
                        surface: '#FFFFFF',
                        oat: '#F4EFE6',
                        'oat-dark': '#C9A982',
                        sage: '#6E8B74',
                        'sage-soft': '#EEF3EF',
                        ink: '#2E2C29',
                        muted: '#8A847C'
                    },
                    boxShadow: {
                        'soft': '0 4px 24px -4px rgba(46, 44, 41, 0.04)',
                        'float': '0 10px 30px -6px rgba(46, 44, 41, 0.18)'
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        body {
            background-color: #FBF9F5;
            color: #2E2C29;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.01em;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .note-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.28s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .note-drawer.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .note-drawer > div {
            overflow: hidden;
        }
        .chevron-icon {
            transition: transform 0.25s ease;
        }
        .chevron-icon.rotated {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="antialiased selection:bg-sage-soft selection:text-sage">

<div class="max-w-5xl mx-auto min-h-screen relative px-4 pt-5 pb-28 md:p-8 flex flex-col md:flex-row gap-6 md:gap-8">

    <!-- 左側：今日概況與體態 -->
    <div id="left-sidebar" class="w-full md:w-80 flex-shrink-0 md:sticky md:top-8 h-fit space-y-5">

        <header class="p-6 bg-surface rounded-3xl shadow-soft">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-sm text-muted font-medium tracking-wide" id="current-date">載入中...</p>
                    <h1 class="text-2xl font-bold text-ink tracking-tight mt-1">今日飲食手帳</h1>
                </div>
                <button onclick="openDataModal()" class="p-2.5 text-muted hover:text-ink hover:bg-oat rounded-2xl transition" title="資料管理與匯入">
                    <i class="ph ph-sliders-horizontal text-2xl"></i>
                </button>
            </div>

            <!-- 熱量與蛋白質主數字 -->
            <div class="grid grid-cols-2 gap-4 pb-6">
                <div>
                    <p class="text-sm text-muted mb-1.5">今日熱量</p>
                    <div class="flex items-baseline gap-1.5">
                        <span class="text-3xl font-bold tracking-tight text-ink" id="total-cals">0</span>
                        <span class="text-sm text-muted">大卡</span>
                    </div>
                </div>
                <div>
                    <p class="text-sm text-muted mb-1.5">蛋白質</p>
                    <div class="flex items-baseline gap-1.5">
                        <span class="text-3xl font-bold tracking-tight text-sage" id="total-protein">0</span>
                        <span class="text-sm text-muted">公克</span>
                    </div>
                </div>
            </div>

            <!-- 溫和進度條區 -->
            <div class="space-y-4 py-5 border-y border-stone-100">
                <div>
                    <div class="flex justify-between items-center text-sm mb-2">
                        <span class="text-ink/85 font-medium flex items-center gap-1.5">
                            <i class="ph-fill ph-leaf text-sage text-base"></i> 蛋白質目標
                        </span>
                        <span id="protein-status" class="text-sage font-semibold">還差 70g</span>
                    </div>
                    <div class="w-full bg-sage-soft rounded-full h-2.5 overflow-hidden">
                        <div class="bg-sage h-2.5 rounded-full transition-all duration-500" id="protein-bar" style="width: 0%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center text-sm mb-2">
                        <span class="text-ink/85 font-medium flex items-center gap-1.5">
                            <i class="ph-fill ph-drop text-oat-dark text-base"></i> 每日水分
                        </span>
                        <span id="water-text" class="text-muted font-medium">0 / 2000 ml</span>
                    </div>
                    <div class="w-full bg-oat rounded-full h-2.5 overflow-hidden">
                        <div class="bg-oat-dark h-2.5 rounded-full transition-all duration-500" id="water-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 最新體態 -->
            <div class="mt-5 cursor-pointer group" onclick="openScaleModal()">
                <div class="flex items-center justify-between mb-3.5">
                    <span class="text-sm font-semibold text-ink/80 flex items-center gap-1.5">
                        <i class="ph ph-scales text-muted text-lg"></i> 最新體態
                    </span>
                    <span id="scale-date" class="text-xs text-muted group-hover:text-sage transition flex items-center gap-1">
                        點擊更新 <i class="ph ph-caret-right text-xs"></i>
                    </span>
                </div>
                <div class="grid grid-cols-3 divide-x divide-stone-200/60 text-center py-1">
                    <div class="px-1">
                        <p class="text-xs text-muted">體重</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-weight">-</p>
                    </div>
                    <div class="px-1">
                        <p class="text-xs text-muted">體脂率</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-fat">-</p>
                    </div>
                    <div class="px-1">
                        <p class="text-xs text-muted">腰圍</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-waist">-</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- 桌機版快速紀錄 -->
        <div class="hidden md:block bg-surface p-5 rounded-3xl shadow-soft">
            <h2 class="text-sm font-semibold text-muted mb-3.5 px-1 tracking-wider">快速紀錄</h2>
            <div class="grid grid-cols-4 gap-2.5">
                <button onclick="openModal('meal', '早餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-coffee text-2xl mb-1 text-oat-dark"></i>
                    <span class="text-sm font-medium">早餐</span>
                </button>
                <button onclick="openModal('meal', '午餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-bowl-food text-2xl mb-1 text-sage"></i>
                    <span class="text-sm font-medium">午餐</span>
                </button>
                <button onclick="openModal('meal', '晚餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-cooking-pot text-2xl mb-1 text-stone-500"></i>
                    <span class="text-sm font-medium">晚餐</span>
                </button>
                <button onclick="addWater()" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-drop text-2xl mb-1 text-oat-dark"></i>
                    <span class="text-sm font-medium">+250ml</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側主內容區：頂部頁籤切換（飲食日記 / 趨勢統計） -->
    <div class="flex-1 w-full min-w-0 space-y-5">

        <div class="flex items-center bg-surface p-1.5 rounded-full shadow-soft">
            <button onclick="switchMainTab('journal')" id="top-tab-journal" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold bg-ink text-paper transition">
                <i class="ph ph-book-open-text text-lg"></i> 飲食日記
            </button>
            <button onclick="switchMainTab('stats')" id="top-tab-stats" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-semibold text-muted hover:text-ink transition">
                <i class="ph ph-chart-bar text-lg"></i> 趨勢統計
            </button>
        </div>

        <!-- ==================== 分頁 1：飲食日記 ==================== -->
        <section id="view-journal" class="bg-surface rounded-3xl shadow-soft p-5 md:p-7 min-h-[60vh]">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                <h2 class="text-lg font-bold text-ink flex items-center gap-2">
                    <i class="ph ph-book-open-text text-xl text-oat-dark"></i> 每日飲食紀錄
                </h2>

                <div class="flex items-center gap-2">
                    <input type="date" id="date-search-input" onchange="handleDateSearch(this.value)" class="text-sm bg-paper text-ink px-3.5 py-2 rounded-full outline-none cursor-pointer">
                    <button id="clear-date-btn" onclick="clearDateSearch()" class="hidden text-sm text-muted hover:text-ink bg-oat px-3.5 py-2 rounded-full transition">
                        顯示全部
                    </button>
                </div>
            </div>

            <!-- 橫向藥丸餐別篩選列 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-5 hide-scrollbar" id="timeline-filter-bar">
                <button onclick="setTimelineFilter('all')" data-cat="all" class="tl-pill shrink-0 text-sm font-medium px-4 py-2 rounded-full bg-ink text-paper transition">全部</button>
                <button onclick="setTimelineFilter('早餐')" data-cat="早餐" class="tl-pill shrink-0 text-sm font-medium px-4 py-2 rounded-full bg-paper text-muted hover:text-ink transition">早餐</button>
                <button onclick="setTimelineFilter('午餐')" data-cat="午餐" class="tl-pill shrink-0 text-sm font-medium px-4 py-2 rounded-full bg-paper text-muted hover:text-ink transition">午餐</button>
                <button onclick="setTimelineFilter('晚餐')" data-cat="晚餐" class="tl-pill shrink-0 text-sm font-medium px-4 py-2 rounded-full bg-paper text-muted hover:text-ink transition">晚餐</button>
                <button onclick="setTimelineFilter('宵夜')" data-cat="宵夜" class="tl-pill shrink-0 text-sm font-medium px-4 py-2 rounded-full bg-paper text-muted hover:text-ink transition">宵夜</button>
            </div>

            <div id="timeline-container" class="space-y-6"></div>

            <div id="load-more-wrapper" class="hidden text-center pt-6">
                <button onclick="loadMoreDays()" class="text-sm font-medium text-muted hover:text-ink bg-paper hover:bg-oat px-6 py-2.5 rounded-full transition">
                    載入更早的紀錄
                </button>
            </div>
        </section>

        <!-- ==================== 分頁 2：趨勢統計 ==================== -->
        <div id="view-stats" class="hidden space-y-6">

            <!-- 區塊 A：可橫向滑動的趨勢柱狀圖 -->
            <section class="bg-surface rounded-3xl shadow-soft p-5 md:p-7">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-ink flex items-center gap-2">
                            <i class="ph ph-chart-bar text-xl text-sage"></i> 近期飲食節奏
                        </h2>
                        <p class="text-sm text-muted mt-0.5">點擊柱子看當日明細，資料多時可左右滑動</p>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex bg-paper p-1 rounded-full">
                            <button onclick="setChartMetric('calories')" id="metric-cal-btn" class="text-sm font-medium px-3.5 py-1.5 rounded-full bg-surface text-ink shadow-xs transition">熱量</button>
                            <button onclick="setChartMetric('protein')" id="metric-pro-btn" class="text-sm font-medium px-3.5 py-1.5 rounded-full text-muted hover:text-ink transition">蛋白質</button>
                        </div>
                        <select id="chart-range-select" onchange="setChartRange(this.value)" class="text-sm font-medium bg-paper text-ink px-3.5 py-2 rounded-full outline-none cursor-pointer border-0">
                            <optgroup label="快捷天數">
                                <option value="7">近 7 天</option>
                                <option value="14" selected>近 14 天</option>
                                <option value="30">近 30 天</option>
                                <option value="all">全部紀錄</option>
                            </optgroup>
                            <optgroup id="chart-month-options" label="依年度月份"></optgroup>
                        </select>
                    </div>
                </div>

                <!-- 餐別趨勢切換膠囊列 -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar" id="chart-meal-tabs">
                    <button onclick="setChartMealFilter('all')" data-cmeal="all" class="cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-ink text-paper transition">全部堆疊</button>
                    <button onclick="setChartMealFilter('早餐')" data-cmeal="早餐" class="cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">早餐</button>
                    <button onclick="setChartMealFilter('午餐')" data-cmeal="午餐" class="cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">午餐</button>
                    <button onclick="setChartMealFilter('晚餐')" data-cmeal="晚餐" class="cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">晚餐</button>
                    <button onclick="setChartMealFilter('宵夜')" data-cmeal="宵夜" class="cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">宵夜</button>
                </div>

                <!-- 橫向可滑動圖表容器 -->
                <div id="chart-scroll-wrapper" class="w-full overflow-x-auto hide-scrollbar pb-1">
                    <div id="chart-inner-box" class="relative h-60 md:h-64 min-w-full">
                        <canvas id="dietTrendChart"></canvas>
                    </div>
                </div>

                <div id="chart-scroll-hint" class="hidden items-center justify-center gap-2 text-xs text-muted mt-3">
                    <i class="ph ph-arrow-left text-sm"></i>
                    <span>左右滑動查看更早日期</span>
                    <i class="ph ph-arrow-right text-sm"></i>
                </div>
            </section>

            <!-- 區塊 B：各餐飲食種類統計（手動滑動卡片＋下方箭頭提醒） -->
            <section class="bg-surface rounded-3xl shadow-soft p-5 md:p-7">
                <div class="flex items-start justify-between gap-2 mb-4">
                    <div>
                        <h3 class="text-lg font-bold text-ink flex items-center gap-2">
                            <i class="ph ph-fork-knife text-xl text-oat-dark"></i> 各餐飲食種類統計
                        </h3>
                        <p class="text-sm text-muted mt-0.5">同類品項自動歸納，方便比較近期習慣變化</p>
                    </div>
                    <span id="meal-stats-range-badge" class="text-xs font-semibold text-sage bg-sage-soft px-3 py-1.5 rounded-full shrink-0">近 14 天</span>
                </div>

                <div id="meal-carousel" class="flex gap-4 overflow-x-auto snap-x snap-mandatory hide-scrollbar scroll-smooth pb-1"></div>

                <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between gap-3">
                    <button onclick="scrollMealCarousel(-1)" id="carousel-prev-btn" class="w-10 h-10 rounded-full bg-paper hover:bg-oat text-ink flex items-center justify-center transition active:scale-95 disabled:opacity-35" aria-label="上一張餐別卡片">
                        <i class="ph-bold ph-arrow-left text-base"></i>
                    </button>

                    <div class="flex flex-col items-center gap-1.5">
                        <div class="flex items-center gap-2" id="carousel-dots"></div>
                        <span id="carousel-hint-text" class="text-xs text-muted flex items-center gap-1">
                            左右滑動或點箭頭切換餐別
                        </span>
                    </div>

                    <button onclick="scrollMealCarousel(1)" id="carousel-next-btn" class="w-10 h-10 rounded-full bg-paper hover:bg-oat text-ink flex items-center justify-center transition active:scale-95 disabled:opacity-35" aria-label="下一張餐別卡片">
                        <i class="ph-bold ph-arrow-right text-base"></i>
                    </button>
                </div>
            </section>
        </div>
    </div>
</div>

<!-- 手機拇指區：半透明霧面懸浮膠囊導覽列 -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 md:hidden z-30 flex items-center gap-1 px-2 py-2 rounded-full bg-[#2E2C29]/92 backdrop-blur-md text-[#FBF9F5] shadow-float max-w-[95vw]">
    <button onclick="switchMainTab('journal')" id="nav-tab-journal" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/15 text-white text-xs font-semibold active:scale-95 transition whitespace-nowrap">
        <i class="ph ph-book-open-text text-base"></i> 日記
    </button>
    <button onclick="switchMainTab('stats')" id="nav-tab-stats" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-stone-300 hover:bg-white/10 text-xs font-medium active:scale-95 transition whitespace-nowrap">
        <i class="ph ph-chart-bar text-base"></i> 統計
    </button>
    <button onclick="openModal('meal', '午餐')" class="flex items-center gap-1 px-3.5 py-2 rounded-full bg-sage text-white text-xs font-semibold active:scale-95 transition whitespace-nowrap">
        <i class="ph-bold ph-plus text-sm"></i> 記一餐
    </button>
    <button onclick="addWater()" class="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-white/10 text-xs font-medium active:scale-95 transition whitespace-nowrap">
        <i class="ph ph-drop text-base text-oat-dark"></i> 水
    </button>
</nav>

<!-- 柔和提示條 (Toast) -->
<div id="toast-container" class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-2">
    <div class="bg-[#2E2C29]/92 backdrop-blur-md text-[#FBF9F5] text-sm font-medium px-4 py-2.5 rounded-full shadow-float flex items-center gap-2 whitespace-nowrap">
        <i id="toast-icon" class="ph-fill ph-check-circle text-sage text-lg"></i>
        <span id="toast-message">已儲存</span>
    </div>
</div>

<!-- 體態彈窗 -->
<div id="scale-modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-xs z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-surface w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-ink">更新體態數據</h3>
            <button onclick="closeModal('scale-modal')" class="p-2 text-muted hover:text-ink rounded-full bg-paper">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-muted mb-1.5">體重 (kg)</label>
                <input type="number" step="0.1" id="input-weight" placeholder="例如：72.5" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-muted mb-1.5">體脂率 (%) 選填</label>
                    <input type="number" step="0.1" id="input-fat" placeholder="-" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-muted mb-1.5">腰圍 (cm) 選填</label>
                    <input type="number" step="0.1" id="input-waist" placeholder="-" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
            </div>
            <button onclick="saveScaleData()" class="w-full bg-ink text-paper font-medium rounded-2xl py-3.5 text-base hover:opacity-90 transition mt-2">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<!-- 飲食手動新增彈窗 -->
<div id="entry-modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-xs z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-surface w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-ink" id="modal-title">記一餐</h3>
            <button onclick="closeModal('entry-modal')" class="p-2 text-muted hover:text-ink rounded-full bg-paper">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div class="flex gap-1.5 flex-wrap" id="modal-category-pills">
                <button type="button" onclick="selectModalCategory('早餐')" data-mcat="早餐" class="mcat-btn text-sm px-3.5 py-1.5 rounded-full bg-paper text-muted transition">早餐</button>
                <button type="button" onclick="selectModalCategory('午餐')" data-mcat="午餐" class="mcat-btn text-sm px-3.5 py-1.5 rounded-full bg-paper text-muted transition">午餐</button>
                <button type="button" onclick="selectModalCategory('晚餐')" data-mcat="晚餐" class="mcat-btn text-sm px-3.5 py-1.5 rounded-full bg-paper text-muted transition">晚餐</button>
                <button type="button" onclick="selectModalCategory('宵夜')" data-mcat="宵夜" class="mcat-btn text-sm px-3.5 py-1.5 rounded-full bg-paper text-muted transition">宵夜</button>

<script>
    const firebaseConfig = {

    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v4')) || [],

    };

    const DAILY_WATER_GOAL = 2000;

    let chartInstance = null;

    const PASTEL_COLORS = {
        '早餐': '#E5C6A0',

    function round1(num) {
        return Math.round((parseFloat(num) || 0) * 10) / 10;

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        msgEl.textContent = message;
        iconEl.className = isError
            ? 'ph-fill ph-warning-circle text-rose-400 text-lg'
            : 'ph-fill ph-check-circle text-sage text-lg';

        container.classList.remove('opacity-0', 'translate-y-2');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            container.classList.add('opacity-0', 'translate-y-2');

    }

    // ==========================================
    // 主分頁切換（飲食日記 <-> 趨勢統計）
    // ==========================================
    function switchMainTab(tab) {
        currentMainTab = tab;
        const viewJournal = document.getElementById('view-journal');
        const viewStats = document.getElementById('view-stats');
        const topJournal = document.getElementById('top-tab-journal');
        const topStats = document.getElementById('top-tab-stats');
        const navJournal = document.getElementById('nav-tab-journal');
        const navStats = document.getElementById('nav-tab-stats');

        if (tab === 'journal') {
            viewJournal.classList.remove('hidden');
            viewStats.classList.add('hidden');
            topJournal.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold bg-ink text-paper transition';
            topStats.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-semibold text-muted hover:text-ink transition';
            navJournal.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/15 text-white text-xs font-semibold active:scale-95 transition whitespace-nowrap';
            navStats.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-full text-stone-300 hover:bg-white/10 text-xs font-medium active:scale-95 transition whitespace-nowrap';
        } else {
            viewJournal.classList.add('hidden');
            viewStats.classList.remove('hidden');
            topStats.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold bg-ink text-paper transition';
            topJournal.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-semibold text-muted hover:text-ink transition';
            navStats.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/15 text-white text-xs font-semibold active:scale-95 transition whitespace-nowrap';
            navJournal.className = 'flex items-center gap-1.5 px-3.5 py-2 rounded-full text-stone-300 hover:bg-white/10 text-xs font-medium active:scale-95 transition whitespace-nowrap';

            setTimeout(() => {
                renderChart();
                renderMealStats();
            }, 30);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function normalizeMealCategory(catStr) {
        if (!catStr) return '點心/其他';
        if (catStr.includes('早')) return '早餐';
        if (catStr.includes('午餐') || (catStr.includes('午') && !catStr.includes('下午'))) return '午餐';
        if (catStr.includes('晚')) return '晚餐';
        if (catStr.includes('宵夜') || catStr.includes('夜')) return '宵夜';
        return '點心/其他';
    }

    function getDateKey(ts) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function refreshAllViews() {
        populateMonthOptions();
        renderDashboard();
        renderTimeline();
        if (currentMainTab === 'stats') {
            renderChart();
            renderMealStats();
        }
    }

    async function syncFromFirebase() {
        try {
            const snapshot = await db.collection('diet_records').get();
            const cloudData = [];

            snapshot.forEach(doc => {
                const data = doc.data();
                let timeStr = new Date().toISOString();
                if (data.createdAt) {
                    if (typeof data.createdAt.toDate === 'function') {
                        timeStr = data.createdAt.toDate().toISOString();
                    } else {
                        timeStr = new Date(data.createdAt).toISOString();
                    }
                }

                cloudData.push({
                    id: doc.id,
                    type: 'meal',
                    category: data.type || '晚餐',
                    title: data.title || '未命名餐點',
                    calories: Math.round(parseFloat(data.calories)) || 0,
                    protein: round1(data.protein),
                    analysis: data.analysis || '',
                    advice: data.advice || '',
                    context: data.context || '',
                    timestamp: timeStr
                });
            });

            const combined = [...cloudData, ...state.entries];
            const uniqueEntries = Array.from(new Map(combined.map(item => [item.id, item])).values());
            state.entries = uniqueEntries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveData();
            refreshAllViews();
        } catch (error) {
            console.error("Firebase 讀取失敗:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateDate();
        renderScaleData();
        refreshAllViews();
        initCarouselScrollListener();
        syncFromFirebase();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    // ==========================================
    // 動態年月選單與區間資料篩選
    // ==========================================
    function populateMonthOptions() {
        const monthGroup = document.getElementById('chart-month-options');
        const selectEl = document.getElementById('chart-range-select');
        if (!monthGroup || !selectEl) return;

        const monthsSet = new Set();
        state.entries.filter(e => e.type === 'meal').forEach(e => {
            const d = new Date(e.timestamp);
            if (!isNaN(d)) {
                const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                monthsSet.add(ym);
            }
        });

        const sortedMonths = Array.from(monthsSet).sort((a, b) => b.localeCompare(a));
        monthGroup.innerHTML = sortedMonths.map(ym => {
            const [y, m] = ym.split('-');
            return `<option value="${ym}">${y} 年 ${parseInt(m)} 月</option>`;
        }).join('');

        if (Array.from(selectEl.options).some(o => o.value === currentChartRange)) {
            selectEl.value = currentChartRange;
        }
    }

    function getRangeLabel(range) {
        if (range === 'all') return '全部紀錄';
        if (range.includes('-')) {
            const [y, m] = range.split('-');
            return `${y} 年 ${parseInt(m)} 月`;
        }
        return `近 ${range} 天`;
    }

    function getFilteredMealData() {
        const sortedAsc = [...state.entries]
            .filter(e => e.type === 'meal')
            .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        const dailyMap = new Map();

        sortedAsc.forEach(e => {
            const d = new Date(e.timestamp);
            const dateKey = getDateKey(e.timestamp);
            const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

            if (currentChartRange.includes('-') && ym !== currentChartRange) return;

            const label = `${d.getMonth() + 1}/${d.getDate()}`;
            if (!dailyMap.has(dateKey)) {
                dailyMap.set(dateKey, {
                    dateKey,
                    label,
                    entries: [],
                    meals: {
                        '早餐': { cal: 0, pro: 0 },
                        '午餐': { cal: 0, pro: 0 },
                        '晚餐': { cal: 0, pro: 0 },
                        '宵夜': { cal: 0, pro: 0 },
                        '點心/其他': { cal: 0, pro: 0 }
                    }
                });
            }

            const item = dailyMap.get(dateKey);
            item.entries.push(e);
            const cat = normalizeMealCategory(e.category);
            item.meals[cat].cal += Math.round(parseFloat(e.calories)) || 0;
            item.meals[cat].pro = round1(item.meals[cat].pro + (parseFloat(e.protein) || 0));
        });

        let dayList = Array.from(dailyMap.values());
        if (!currentChartRange.includes('-') && currentChartRange !== 'all') {
            const limit = parseInt(currentChartRange);
            dayList = dayList.slice(-limit);
        }

        const filteredEntries = dayList.flatMap(d => d.entries);
        return { dayList, filteredEntries };
    }

    // ==========================================
    // 橫向可滑動趨勢圖表
    // ==========================================
    function setChartMetric(metric) {
        currentChartMetric = metric;
        const calBtn = document.getElementById('metric-cal-btn');
        const proBtn = document.getElementById('metric-pro-btn');
        if (metric === 'calories') {
            calBtn.className = 'text-sm font-medium px-3.5 py-1.5 rounded-full bg-surface text-ink shadow-xs transition';
            proBtn.className = 'text-sm font-medium px-3.5 py-1.5 rounded-full text-muted hover:text-ink transition';
        } else {
            proBtn.className = 'text-sm font-medium px-3.5 py-1.5 rounded-full bg-surface text-sage shadow-xs transition';
            calBtn.className = 'text-sm font-medium px-3.5 py-1.5 rounded-full text-muted hover:text-ink transition';
        }
        renderChart();
    }

    function setChartRange(range) {
        currentChartRange = range;
        renderChart();
        renderMealStats();
    }

    function setChartMealFilter(meal) {
        currentChartMeal = meal;
        document.querySelectorAll('.cmeal-pill').forEach(btn => {
            if (btn.dataset.cmeal === meal) {
                btn.className = 'cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-ink text-paper transition';
            } else {
                btn.className = 'cmeal-pill shrink-0 text-sm font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition';
            }
        });
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('dietTrendChart');
        const innerBox = document.getElementById('chart-inner-box');
        const scrollWrapper = document.getElementById('chart-scroll-wrapper');
        const scrollHint = document.getElementById('chart-scroll-hint');
        if (!ctx || !innerBox) return;

        const { dayList } = getFilteredMealData();
        const labels = dayList.map(d => d.label);
        const field = currentChartMetric === 'calories' ? 'cal' : 'pro';
        const unit = currentChartMetric === 'calories' ? '大卡' : 'g';

        const neededWidth = dayList.length * 48;
        const containerWidth = scrollWrapper.clientWidth || 320;
        if (neededWidth > containerWidth) {
            innerBox.style.width = `${neededWidth}px`;
            scrollHint.classList.remove('hidden');
            scrollHint.classList.add('flex');
        } else {
            innerBox.style.width = '100%';
            scrollHint.classList.add('hidden');
            scrollHint.classList.remove('flex');
        }

        let datasets = [];
        if (currentChartMeal === 'all') {
            datasets = ['早餐', '午餐', '晚餐', '宵夜', '點心/其他'].map(meal => ({
                label: meal,
                data: dayList.map(d => d.meals[meal][field]),
                backgroundColor: PASTEL_COLORS[meal],
                borderRadius: 4,
                borderSkipped: false,
                stack: 'meals',
                maxBarThickness: 28
            }));
        } else {
            datasets = [{
                label: `${currentChartMeal}${currentChartMetric === 'calories' ? '熱量' : '蛋白質'}`,
                data: dayList.map(d => d.meals[currentChartMeal][field]),
                backgroundColor: PASTEL_COLORS[currentChartMeal] || '#8FB096',
                borderRadius: 6,
                borderSkipped: false,
                maxBarThickness: 32
            }];
        }

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        display: currentChartMeal === 'all',
                        position: 'bottom',
                        labels: {
                            boxWidth: 10,
                            boxHeight: 10,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            padding: 14,
                            color: '#8A847C',
                            font: { size: 12 }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(46, 44, 41, 0.92)',
                        padding: 12,
                        cornerRadius: 12,
                        titleFont: { size: 13 },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: (item) => `${item.dataset.label}：${item.parsed.y} ${unit}`,
                            footer: (items) => {
                                if (currentChartMeal !== 'all') return '';
                                const sum = round1(items.reduce((acc, i) => acc + i.parsed.y, 0));
                                return `當日總計：${sum} ${unit}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: currentChartMeal === 'all',
                        grid: { display: false },
                        border: { display: false },
                        ticks: { color: '#8A847C', font: { size: 12 }, maxRotation: 0 }
                    },
                    y: {
                        stacked: currentChartMeal === 'all',
                        border: { display: false },
                        grid: { color: 'rgba(46, 44, 41, 0.05)' },
                        ticks: { color: '#8A847C', font: { size: 12 } }
                    }
                }
            }
        });

        requestAnimationFrame(() => {
            scrollWrapper.scrollLeft = scrollWrapper.scrollWidth;
        });
    }

    // ==========================================
    // 同類品項歸納 + 各餐飲食統計（手動滑動卡片）
    // ==========================================
    function extractFoodGroups(rawTitle) {
        if (!rawTitle) return [];
        const text = rawTitle.trim();

        if (/跳過|未進食|跳餐|沒吃|斷食/.test(text)) {
            return ['跳餐 / 未進食'];
        }

        const parts = text.split(/[＋+、]/).map(s => s.trim()).filter(Boolean);
        const groups = new Set();

        const rules = [
            { pattern: /優格|藍莓/, label: '藍莓 / 無糖優格' },
            { pattern: /美式|黑咖啡|Nespresso|咖啡(?!麵包)/i, label: '美式 / 咖啡' },
            { pattern: /洋芋片|卡辣姆久|樂事|多力多滋|雪餅|小泡芙/, label: '洋芋片 / 零嘴' },
            { pattern: /健康餐盒|給力盒子|初喚|溫沙拉|沙拉碗|沙拉盆|沙拉|舒肥雞|手撕雞|汆燙瘦豬肉/, label: '健康餐盒 / 溫沙拉' },
            { pattern: /咔啦|卡啦|漢堡|牛肉堡|鷄塊|雞塊|麥當勞|肯德基(?!.*蛋塔)/, label: '速食漢堡 / 雞塊' },
            { pattern: /蛋塔/, label: '蛋塔' },
            { pattern: /宜蘭餅|牛舌餅/, label: '宜蘭餅 / 薄餅' },
            { pattern: /可頌|鹽奶油卷|奶油卷/, label: '可頌 / 奶油捲' },
            { pattern: /蛋捲酥|鳳梨酥|千層酥/, label: '蛋捲酥 / 糕餅' },
            { pattern: /起酥|肉鬆麵包|肉絲麵包|菠蘿|吐司(?!.*肉蛋)|維也納|蛋糕捲|乳酪塔|麵包/, label: '烘焙麵包 / 甜點' },
            { pattern: /蛋餅|肉蛋吐司|三明治|燒餅/, label: '蛋餅 / 三明治' },
            { pattern: /豆漿|豆乳/, label: '豆漿 / 豆乳' },
            { pattern: /鍋貼|水餃/, label: '鍋貼 / 水餃' },
            { pattern: /披薩|比薩|筆管麵|義大利麵/, label: '披薩 / 義麵' },
            { pattern: /鐵板麵|烏龍麵|拉麵|炸醬麵|麵線|鍋燒麵|泡麵|魚酥麵|土魠魚麵|乾麵|拌麵/, label: '麵食 / 湯麵' },
            { pattern: /咖哩飯|炒飯|丼|雞肉飯|便當|排骨飯|粥/, label: '飯類 / 便當' },
            { pattern: /燒肉|牛五花|松阪豬/, label: '燒肉 / 烤肉' },
            { pattern: /滷味|燙青菜|空心菜|花椰菜/, label: '滷味 / 青菜' },
            { pattern: /鹹酥雞|香香雞|炸雞腿|炸排骨|香腸|肉丸/, label: '炸物 / 肉類小吃' },
            { pattern: /鮭魚|蝦仁|海鮮/, label: '海鮮 / 鮭魚' },
            { pattern: /地瓜/, label: '蒸 / 烤地瓜' },
            { pattern: /蘋果|芭樂|西瓜|水果/, label: '水果' },
            { pattern: /茶葉蛋|水煮蛋|荷包蛋|溫泉蛋/, label: '雞蛋' }
        ];

        parts.forEach(part => {
            if (/猛健樂|施打|喝水|白開水/.test(part)) return;

            let matched = false;
            for (const rule of rules) {
                if (rule.pattern.test(part)) {
                    groups.add(rule.label);
                    matched = true;
                    break;
                }
            }

            if (!matched) {
                let cleaned = part
                    .replace(/\(.*?\)|（.*?）/g, '')
                    .replace(/\d+(\.\d+)?\s*(份|碗|個|顆|塊|片|杯|瓶|罐|包|盒|根|條|隻|大塊|小包|ml|g)/gi, '')
                    .replace(/7-11|全家|全聯|早餐店|外送|麵攤|傳統麵包店/g, '')
                    .trim();
                if (cleaned.length > 8) cleaned = cleaned.slice(0, 8);
                if (cleaned.length >= 2) groups.add(cleaned);
            }
        });

        return Array.from(groups);
    }

        const carousel = document.getElementById('meal-carousel');

    function updateCarouselUI(activeIdx) {
        currentCarouselIdx = activeIdx;
        const dotsEl = document.getElementById('carousel-dots');
        const hintEl = document.getElementById('carousel-hint-text');
        const prevBtn = document.getElementById('carousel-prev-btn');
        const nextBtn = document.getElementById('carousel-next-btn');

        if (dotsEl) {
            dotsEl.innerHTML = MEAL_ORDER.map((name, i) => `
                <button onclick="jumpToMealSlide(${i})" class="h-2 rounded-full transition-all ${i === activeIdx ? 'w-6 bg-sage' : 'w-2 bg-stone-300 hover:bg-stone-400'}" aria-label="切換至${name}"></button>
            `).join('');
        }
        if (hintEl) {
            hintEl.textContent = `${MEAL_ORDER[activeIdx]} (${activeIdx + 1}/4) ・ 左右滑動瀏覽`;
        }
        if (prevBtn) prevBtn.disabled = activeIdx <= 0;
        if (nextBtn) nextBtn.disabled = activeIdx >= MEAL_ORDER.length - 1;
    }

    function initCarouselScrollListener() {
        const carousel = document.getElementById('meal-carousel');
        if (!carousel) return;
        let scrollDebounce = null;
        carousel.addEventListener('scroll', () => {
            clearTimeout(scrollDebounce);
            scrollDebounce = setTimeout(() => {
                const slides = carousel.querySelectorAll('.meal-slide');
                if (!slides.length) return;
                const center = carousel.scrollLeft + carousel.clientWidth / 2;
                let closestIdx = 0;
                let minDist = Infinity;
                slides.forEach((slide, idx) => {
                    const slideCenter = slide.offsetLeft + slide.offsetWidth / 2;
                    const dist = Math.abs(center - slideCenter);
                    if (dist < minDist) {
                        minDist = dist;
                        closestIdx = idx;
                    }
                });
                updateCarouselUI(closestIdx);
            }, 60);
        });
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const loadMoreWrapper = document.getElementById('load-more-wrapper');

        let filtered = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (selectedSearchDate) {
            filtered = filtered.filter(e => getDateKey(e.timestamp) === selectedSearchDate);
        }

        if (currentTimelineFilter !== 'all') {
            filtered = filtered.filter(e => e.type === 'meal' && normalizeMealCategory(e.category) === currentTimelineFilter);
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="text-center py-14 text-muted text-base">
                    <i class="ph ph-notebook text-4xl mb-2 block text-stone-300"></i>
                    <p>${selectedSearchDate ? '這天沒有符合的飲食紀錄' : '目前還沒有紀錄，點下方按鈕就能輕鬆記一餐'}</p>
                </div>`;
            loadMoreWrapper.classList.add('hidden');
            return;
        }

        const daysMap = new Map();
        filtered.forEach(entry => {
            const d = new Date(entry.timestamp);
            const dateKey = getDateKey(entry.timestamp);
            const dateLabel = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });

            if (!daysMap.has(dateKey)) {
                daysMap.set(dateKey, { label: dateLabel, cals: 0, protein: 0, entries: [] });
            }
            const dayObj = daysMap.get(dateKey);
            dayObj.entries.push(entry);
            if (entry.type === 'meal') {
                dayObj.cals += Math.round(parseFloat(entry.calories)) || 0;
                dayObj.protein = round1(dayObj.protein + (parseFloat(entry.protein) || 0));
            }
        });

        const allDays = Array.from(daysMap.values());
        const showDays = selectedSearchDate ? allDays : allDays.slice(0, visibleDaysLimit);

        if (!selectedSearchDate && allDays.length > visibleDaysLimit) {
            loadMoreWrapper.classList.remove('hidden');

    async function handleTextImport() {
        const text = document.getElementById('import-text').value;
        if (!text.trim()) {
            showToast('請先貼上表格內容', true);
            return;
        }

        const batch = db.batch();
        let addedCount = 0;
        let updatedCount = 0;
        const lines = text.split('\n');

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
            if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);

            let row = [];
            if (cleanLine.includes('|')) {
                row = cleanLine.split('|').map(s => s.trim());
            } else {
                const parsed = Papa.parse(cleanLine);
                if (parsed.data && parsed.data.length > 0) row = parsed.data[0].map(s => s.trim());
            }

            if (row.length < 3) return;

            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                let category = '點心/其他';
                let timeStr = '15:00';

                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }

                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                const context = row[1] || '';
                const content = row[2] || '未紀錄內容';
                let calories = 0, protein = 0, analysis = '', advice = '';

                if (row.length >= 7 && !isNaN(parseFloat(row[3]))) {
                    calories = Math.round(parseFloat(row[3])) || 0;
                    protein = round1(row[4]);
                    analysis = row[5] || '';
                    advice = row[6] || '';
                } else {
                    analysis = row[3] || '';
                    advice = row[4] || '';
                }

                // 表格匯入一律視為餐點，避免水煮蛋、水蓮等食材被誤判為喝水
                const newEntry = {
                    id: 'import_' + Date.now() + Math.random().toString(36).substring(7),
                    type: 'meal',
                    category,
                    title: content,
                    context,
                    calories,
                    protein,
                    analysis,
                    advice,
                    timestamp
                };

                const firebaseData = {
                    type: newEntry.category,
                    title: newEntry.title,
                    context: newEntry.context,
                    calories: newEntry.calories,
                    protein: newEntry.protein,
                    analysis: newEntry.analysis,
                    advice: newEntry.advice,
                    createdAt: firebase.firestore.Timestamp.fromDate(new Date(newEntry.timestamp))
                };

                const existingIndex = state.entries.findIndex(e => e.timestamp.startsWith(dateStr) && e.category === category && e.type === 'meal');

                if (existingIndex !== -1) {
                    newEntry.id = state.entries[existingIndex].id;
                    state.entries[existingIndex] = newEntry;
                    batch.set(db.collection('diet_records').doc(newEntry.id), firebaseData, { merge: true });
                    updatedCount++;
                } else {
                    batch.set(db.collection('diet_records').doc(newEntry.id), firebaseData);
                    state.entries.push(newEntry);
                    addedCount++;
                }
            }
        });

        if (addedCount > 0 || updatedCount > 0) {
            try {
                document.getElementById('import-text').value = '';
                await batch.commit();
                saveData();
                closeModal('data-modal');
                refreshAllViews();
                showToast(`同步完成（新增 ${addedCount}、更新 ${updatedCount}）`);
            } catch (error) {
                console.error("寫入失敗:", error);
                showToast('同步失敗，請檢查網路', true);
            }
        } else {
            showToast('未讀取到有效的表格格式', true);
        }
    }

    function exportData() {
        const backupData = { meals: state.entries, scale: state.scaleData };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `diet_journal_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('已匯出備份檔案');
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.meals) {
                    state.entries = importedData.meals;
                    state.scaleData = importedData.scale || [];
                } else if (Array.isArray(importedData)) {
                    state.entries = importedData;
                }
                saveData();
                localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
                closeModal('data-modal');
                renderScaleData();
                refreshAllViews();
                showToast('備份資料已還原');
            } catch (err) {
                showToast('檔案格式不正確', true);
            }
        };
        reader.readAsText(file);
    }

    function clearAllData() {
        if (confirm('確定要清空所有的手帳紀錄嗎？此操作無法還原。')) {
            state.entries = [];
            state.scaleData = [];
            saveData();
            localStorage.removeItem('scale_entries_v2');
            closeModal('data-modal');
            renderScaleData();
            refreshAllViews();
            showToast('已清空歷史紀錄');
        }
    }

    function saveData() {
        localStorage.setItem('diet_entries_v4', JSON.stringify(state.entries));
    }

    function closeModal(modalId) {
        const m = document.getElementById(modalId);
        m.classList.add('opacity-0');
        setTimeout(() => m.classList.add('hidden'), 200);
    }

    ['entry-modal', 'data-modal', 'scale-modal'].forEach(id => {
        document.getElementById(id).addEventListener('click', (e) => {
            if (e.target.id === id) closeModal(id);
        });
    });
</script>
</body>
</html>

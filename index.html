<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的日常飲食手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { 
            background-color: #FBF9F5; 
            color: #2D2B2A;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-amber-100 selection:text-amber-900">

<div class="max-w-5xl mx-auto min-h-screen relative p-4 md:p-8 flex flex-col md:flex-row gap-6 md:gap-8 pb-24 md:pb-8">
    
    <!-- 左側：今日概況與生活數據 -->
    <div class="w-full md:w-80 flex-shrink-0 md:sticky md:top-8 h-fit space-y-5">
        
        <!-- 今日概況卡片 -->
        <header class="p-6 bg-white rounded-2xl border border-stone-200 shadow-sm relative">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-stone-800 tracking-tight">今日飲食概況</h1>
                    <p class="text-stone-400 text-sm mt-1 font-medium" id="current-date">載入中...</p>
                </div>
                <button onclick="openDataModal()" class="p-2.5 text-stone-400 hover:text-stone-600 hover:bg-stone-100 rounded-lg transition" title="資料管理">
                    <i class="ph ph-sliders text-xl"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-4 pb-5 border-b border-stone-100">
                <div>
                    <p class="text-sm text-stone-500 mb-1">攝取熱量</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold tracking-tight text-stone-800" id="total-cals">0</span>
                        <span class="text-sm text-stone-400">大卡</span>
                    </div>
                </div>
                <div>
                    <p class="text-sm text-stone-500 mb-1">蛋白質</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold tracking-tight text-stone-800" id="total-protein">0</span>
                        <span class="text-sm text-stone-400">公克</span>
                    </div>
                </div>
            </div>

            <!-- 最新體態 -->
            <div class="mt-4 pt-1 cursor-pointer group" onclick="openScaleModal()">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-stone-600 flex items-center gap-1.5">
                        <i class="ph ph-scales text-stone-500 text-lg"></i> 最新體態紀錄
                    </span>
                    <span id="scale-date" class="text-xs text-stone-400 group-hover:text-stone-600 transition">尚未紀錄</span>
                </div>
                <div class="grid grid-cols-3 gap-2 bg-stone-50 rounded-xl p-3 border border-stone-100 text-center">
                    <div>
                        <p class="text-xs text-stone-400">體重</p>
                        <p class="font-semibold text-base text-stone-700 mt-1" id="display-weight">-</p>
                    </div>
                    <div class="border-x border-stone-200">
                        <p class="text-xs text-stone-400">體脂率</p>
                        <p class="font-semibold text-base text-stone-700 mt-1" id="display-fat">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-stone-400">腰圍</p>
                        <p class="font-semibold text-base text-stone-700 mt-1" id="display-waist">-</p>
                    </div>
                </div>
            </div>

            <!-- 飲水目標 -->
            <div class="mt-5 pt-4 border-t border-stone-100">
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-stone-600 font-medium flex items-center gap-1.5">
                        <i class="ph ph-drop text-amber-700 text-lg"></i> 每日水分
                    </span>
                    <span id="water-text" class="text-stone-500 font-medium">0 / 2000 ml</span>
                </div>
                <div class="w-full bg-stone-100 rounded-full h-3 overflow-hidden">
                    <div class="bg-amber-600/80 h-3 rounded-full transition-all duration-500" id="water-bar" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- 快速新增按鈕 -->
        <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
            <h2 class="text-sm font-bold text-stone-400 mb-4 px-1 tracking-wider uppercase">快速紀錄</h2>
            <div class="grid grid-cols-4 gap-3">
                <button onclick="openModal('meal', '早餐')" class="flex flex-col items-center justify-center py-4 bg-stone-50 hover:bg-stone-100 text-stone-700 rounded-xl transition active:scale-95 border border-stone-100">
                    <i class="ph ph-coffee text-2xl mb-1.5"></i>
                    <span class="text-sm font-medium">早餐</span>
                </button>
                <button onclick="openModal('meal', '午餐')" class="flex flex-col items-center justify-center py-4 bg-stone-50 hover:bg-stone-100 text-stone-700 rounded-xl transition active:scale-95 border border-stone-100">
                    <i class="ph ph-bowl-food text-2xl mb-1.5"></i>
                    <span class="text-sm font-medium">午餐</span>
                </button>
                <button onclick="openModal('meal', '晚餐')" class="flex flex-col items-center justify-center py-4 bg-stone-50 hover:bg-stone-100 text-stone-700 rounded-xl transition active:scale-95 border border-stone-100">
                    <i class="ph ph-cooking-pot text-2xl mb-1.5"></i>
                    <span class="text-sm font-medium">晚餐</span>
                </button>
                <button onclick="addWater()" class="flex flex-col items-center justify-center py-4 bg-stone-50 hover:bg-stone-100 text-stone-700 rounded-xl transition active:scale-95 border border-stone-100">
                    <i class="ph ph-drop text-2xl mb-1.5 text-amber-700"></i>
                    <span class="text-sm font-medium">+250ml</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側：分析圖表與飲食時間軸 -->
    <div class="flex-1 w-full bg-white rounded-2xl border border-stone-200 shadow-sm p-5 md:p-8 min-h-[80vh]">
        
        <!-- 圖表分析區塊（溫潤大地配色：整日餐別堆疊柱狀圖） -->
        <div class="mb-8 p-5 bg-stone-50/90 rounded-2xl border border-stone-200">
            <div class="flex flex-col gap-3 mb-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-stone-800 tracking-tight flex items-center gap-2">
                        <i class="ph ph-chart-bar text-xl text-stone-700"></i> 飲食代謝趨勢
                    </h2>
                    <!-- 時間天數切換 -->
                    <div class="flex items-center gap-1 bg-white p-1 rounded-lg border border-stone-200 text-xs">
                        <button onclick="setDaysFilter(7)" data-days="7" class="days-btn px-2 py-1 rounded text-stone-600 font-medium">7天</button>
                        <button onclick="setDaysFilter(14)" data-days="14" class="days-btn px-2 py-1 rounded bg-stone-800 text-white font-bold">14天</button>
                        <button onclick="setDaysFilter(30)" data-days="30" class="days-btn px-2 py-1 rounded text-stone-600 font-medium">30天</button>
                        <button onclick="setDaysFilter(0)" data-days="0" class="days-btn px-2 py-1 rounded text-stone-600 font-medium">全部</button>
                    </div>
                </div>

                <!-- 指標與餐別切換列 -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-stone-200/60">
                    <!-- 數值模式：熱量 vs 蛋白質 -->
                    <div class="flex items-center gap-1 bg-stone-200/60 p-1 rounded-lg text-xs font-bold">
                        <button onclick="setMetricMode('cal')" id="btn-metric-cal" class="px-2.5 py-1 rounded-md bg-white text-stone-800 shadow-2xs">熱量 (kcal)</button>
                        <button onclick="setMetricMode('pro')" id="btn-metric-pro" class="px-2.5 py-1 rounded-md text-stone-500 hover:text-stone-800 font-medium">蛋白質 (g)</button>
                    </div>
                    
                    <!-- 餐別篩選 -->
                    <div class="flex items-center gap-1 overflow-x-auto hide-scrollbar text-xs font-medium">
                        <button onclick="setMealFilter('all')" data-meal="all" class="meal-btn px-2.5 py-1 rounded-lg bg-stone-800 text-white font-bold">整日堆疊</button>
                        <button onclick="setMealFilter('早餐')" data-meal="早餐" class="meal-btn px-2 py-1 rounded-lg bg-white border border-stone-200 text-stone-600">早</button>
                        <button onclick="setMealFilter('午餐')" data-meal="午餐" class="meal-btn px-2 py-1 rounded-lg bg-white border border-stone-200 text-stone-600">午</button>
                        <button onclick="setMealFilter('晚餐')" data-meal="晚餐" class="meal-btn px-2 py-1 rounded-lg bg-white border border-stone-200 text-stone-600">晚</button>
                        <button onclick="setMealFilter('宵夜')" data-meal="宵夜" class="meal-btn px-2 py-1 rounded-lg bg-white border border-stone-200 text-stone-600">宵夜</button>
                    </div>
                </div>
            </div>

            <!-- 圖表畫布容器 -->
            <div class="relative w-full h-56 md:h-64 bg-white rounded-xl p-3 border border-stone-200/80">
                <canvas id="dietTrendChart"></canvas>
            </div>
            
            <div class="flex justify-between items-center text-xs text-stone-400 mt-2.5 px-1">
                <span id="chart-subtext">大地色系堆疊：長條高度為當日總量，內部為各餐佔比</span>
                <span id="chart-avg-text" class="font-medium text-stone-600"></span>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6 pb-4 border-b border-stone-100">
            <h2 class="text-base font-bold text-stone-700 tracking-wider flex items-center gap-2">
                <i class="ph ph-book-open text-xl text-stone-400"></i> 飲食紀錄時間軸
            </h2>
        </div>
        <div id="timeline-container" class="space-y-6"></div>
    </div>

    <!-- 浮動新增按鈕（手機版） -->
    <button onclick="openModal('meal', '點心/其他')" class="fixed bottom-6 right-6 md:hidden w-14 h-14 bg-stone-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-stone-700 transition active:scale-90 z-20">
        <i class="ph ph-plus text-3xl font-bold"></i>
    </button>
</div>

<!-- 體態彈窗 -->
<div id="scale-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl border border-stone-100" id="scale-modal-content">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-stone-800">記錄體態數據</h3>
            <button onclick="closeModal('scale-modal')" class="p-2 text-stone-400 hover:text-stone-600 rounded-lg bg-stone-100">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">體重 (kg)</label>
                <input type="number" step="0.1" id="input-weight" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">體脂率 (%)</label>
                <input type="number" step="0.1" id="input-fat" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">腰圍 (cm)</label>
                <input type="number" step="0.1" id="input-waist" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
            </div>
            <button onclick="saveScaleData()" class="w-full bg-stone-800 text-white font-medium rounded-xl py-3.5 text-base hover:bg-stone-700 transition mt-4">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<!-- 飲食手動新增彈窗 -->
<div id="entry-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl border border-stone-100" id="modal-content">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-stone-800" id="modal-title">手動紀錄</h3>
            <button onclick="closeModal('entry-modal')" class="p-2 text-stone-400 hover:text-stone-600 rounded-lg bg-stone-100">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="space-y-4">
            <input type="hidden" id="entry-type" value="">
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">餐點內容</label>
                <input type="text" id="entry-content" placeholder="例如：烤雞腿便當" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">備註 / 情境</label>
                <input type="text" id="entry-context" placeholder="例如：少飯、外送" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1.5">估算熱量 (大卡)</label>
                    <input type="number" id="entry-cals" placeholder="選填" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1.5">蛋白質 (克)</label>
                    <input type="number" id="entry-protein" placeholder="選填" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-base outline-none focus:border-stone-400 focus:bg-white transition-colors">
                </div>
            </div>
            <button onclick="saveEntry()" class="w-full bg-stone-800 text-white font-medium rounded-xl py-3.5 text-base hover:bg-stone-700 transition mt-4">
                加入手帳
            </button>
        </div>
    </div>
</div>

<!-- 資料管理彈窗 -->
<div id="data-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-7 shadow-xl border border-stone-100 overflow-y-auto max-h-[85vh]" id="data-modal-content">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-stone-100">
            <h3 class="text-lg font-bold text-stone-800">資料管理與手帳備份</h3>
            <button onclick="closeModal('data-modal')" class="p-2 text-stone-400 hover:text-stone-600 rounded-lg bg-stone-100">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        
        <div class="space-y-6">
            <div>
                <h4 class="text-sm font-bold text-stone-700 mb-1.5">貼上 Markdown 筆記同步</h4>
                <p class="text-xs text-stone-500 mb-3 leading-relaxed">可直接將表格貼在下方，系統會自動整理並同步到資料庫。</p>
                <textarea id="import-text" rows="4" class="w-full p-4 text-sm bg-stone-50 border border-stone-200 rounded-xl outline-none focus:border-stone-400 focus:bg-white transition-colors resize-none" placeholder="貼上表格內容..."></textarea>
                <button onclick="handleTextImport()" class="w-full mt-3 py-3 bg-stone-800 text-white text-sm font-medium rounded-xl hover:bg-stone-700 transition">
                    執行同步更新
                </button>
            </div>

            <div class="pt-4 border-t border-stone-100">
                <h4 class="text-sm font-bold text-stone-700 mb-3">備份與重置</h4>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportData()" class="p-3 bg-stone-50 hover:bg-stone-100 border border-stone-200 rounded-xl text-sm text-stone-700 font-medium text-center transition">
                        匯出手帳備份
                    </button>
                    <input type="file" id="json-upload" accept=".json" class="hidden" onchange="handleJSONImport(event)">
                    <button onclick="document.getElementById('json-upload').click()" class="p-3 bg-stone-50 hover:bg-stone-100 border border-stone-200 rounded-xl text-sm text-stone-700 font-medium text-center transition">
                        還原手帳備份
                    </button>
                </div>
                <button onclick="clearAllData()" class="w-full mt-4 p-3 text-rose-600 hover:bg-rose-50 rounded-xl text-sm font-medium transition text-center border border-transparent hover:border-rose-100">
                    清空所有歷史紀錄
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC263lrmHJICThOoMlR4JacvnIJJ6ExxzA",
        authDomain: "diet-tracker-20260819.firebaseapp.com",
        projectId: "diet-tracker-20260819",
        storageBucket: "diet-tracker-20260819.firebasestorage.app",
        messagingSenderId: "574990158319",
        appId: "1:574990158319:web:358b8326ec7b4809c7ce1a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v4')) || [], 
        scaleData: JSON.parse(localStorage.getItem('scale_entries_v2')) || [] 
    };
    const DAILY_WATER_GOAL = 2000;
    
    // 圖表狀態變數
    let chartInstance = null;
    let currentDaysFilter = 14; // 預設顯示 14 天
    let currentMetricMode = 'cal'; // 'cal' (熱量) 或 'pro' (蛋白質)
    let currentMealFilter = 'all'; // 'all', '早餐', '午餐', '晚餐', '宵夜'

    async function syncFromFirebase() {
        try {
            const snapshot = await db.collection('diet_records').get();
            const cloudData = [];
            
            snapshot.forEach(doc => {
                const data = doc.data();
                let timeStr = new Date().toISOString();
                
                if (data.createdAt) {
                    if (typeof data.createdAt.toDate === 'function') {
                        timeStr = data.createdAt.toDate().toISOString();
                    } else {
                        timeStr = new Date(data.createdAt).toISOString();
                    }
                }

                cloudData.push({
                    id: doc.id,
                    type: 'meal',
                    category: data.type || '晚餐', 
                    title: data.title || '未命名餐點',
                    calories: parseInt(data.calories) || 0,
                    protein: parseInt(data.protein) || 0,
                    analysis: data.analysis || '',
                    advice: data.advice || '',
                    context: data.context || 'LINE 同步',
                    timestamp: timeStr
                });
            });

            const combined = [...cloudData, ...state.entries];
            const uniqueEntries = Array.from(new Map(combined.map(item => [item.id, item])).values());
            state.entries = uniqueEntries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveData();
            renderDashboard();
            renderTimeline();
            renderChart();
        } catch (error) {
            console.error("Firebase 讀取失敗:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateDate(); 
        renderDashboard(); 
        renderTimeline();
        renderScaleData();
        renderChart();
        syncFromFirebase();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    // ==========================================
    // 圖表控制器（方案一：日系大地色手帳風）
    // ==========================================
    function setDaysFilter(days) {
        currentDaysFilter = days;
        document.querySelectorAll('.days-btn').forEach(btn => {
            if (parseInt(btn.dataset.days) === days) {
                btn.className = 'days-btn px-2 py-1 rounded bg-stone-800 text-white font-bold';
            } else {
                btn.className = 'days-btn px-2 py-1 rounded text-stone-600 font-medium';
            }
        });
        renderChart();
    }

    function setMetricMode(mode) {
        currentMetricMode = mode;
        const btnCal = document.getElementById('btn-metric-cal');
        const btnPro = document.getElementById('btn-metric-pro');
        if (mode === 'cal') {
            btnCal.className = 'px-2.5 py-1 rounded-md bg-white text-stone-800 shadow-2xs font-bold';
            btnPro.className = 'px-2.5 py-1 rounded-md text-stone-500 hover:text-stone-800 font-medium';
        } else {
            btnPro.className = 'px-2.5 py-1 rounded-md bg-white text-stone-800 shadow-2xs font-bold';
            btnCal.className = 'px-2.5 py-1 rounded-md text-stone-500 hover:text-stone-800 font-medium';
        }
        renderChart();
    }

    function setMealFilter(meal) {
        currentMealFilter = meal;
        document.querySelectorAll('.meal-btn').forEach(btn => {
            if (btn.dataset.meal === meal) {
                btn.className = 'meal-btn px-2.5 py-1 rounded-lg bg-stone-800 text-white font-bold';
            } else {
                btn.className = 'meal-btn px-2.5 py-1 rounded-lg bg-white border border-stone-200 text-stone-600 font-medium';
            }
        });
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('dietTrendChart');
        if (!ctx) return;

        // 依日期做聚合 (由舊到新排序)
        const dailyMap = new Map();
        const sortedAsc = [...state.entries]
            .filter(e => e.type === 'meal')
            .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        sortedAsc.forEach(e => {
            const d = new Date(e.timestamp);
            const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const label = `${d.getMonth() + 1}/${d.getDate()}`;
            
            if (!dailyMap.has(dateKey)) {
                dailyMap.set(dateKey, {
                    label: label,
                    totalCal: 0,
                    totalPro: 0,
                    meals: {
                        '早餐': { cal: 0, pro: 0 },
                        '午餐': { cal: 0, pro: 0 },
                        '晚餐': { cal: 0, pro: 0 },
                        '宵夜': { cal: 0, pro: 0 },
                        '點心/其他': { cal: 0, pro: 0 }
                    }
                });
            }

            const item = dailyMap.get(dateKey);
            const cal = parseInt(e.calories) || 0;
            const pro = parseInt(e.protein) || 0;
            item.totalCal += cal;
            item.totalPro += pro;

            let cat = '點心/其他';
            if (e.category && e.category.includes('早')) cat = '早餐';
            else if (e.category && e.category.includes('午')) cat = '午餐';
            else if (e.category && e.category.includes('晚')) cat = '晚餐';
            else if (e.category && (e.category.includes('宵夜') || e.category.includes('夜'))) cat = '宵夜';

            if (item.meals[cat]) {
                item.meals[cat].cal += cal;
                item.meals[cat].pro += pro;
            } else {
                item.meals['點心/其他'].cal += cal;
                item.meals['點心/其他'].pro += pro;
            }
        });

        let dayList = Array.from(dailyMap.values());

        // 依天數切分（預設最近 14 天）
        if (currentDaysFilter > 0 && dayList.length > currentDaysFilter) {
            dayList = dayList.slice(-currentDaysFilter);
        }

        const labels = dayList.map(d => d.label);
        const isCal = (currentMetricMode === 'cal');
        const metricUnit = isCal ? 'kcal' : 'g';
        const metricTitle = isCal ? '熱量' : '蛋白質';

        // 方案一：溫潤紙質手帳系配色 (大地質樸調)
        const earthPalette = {
            '早餐': { bg: 'rgba(230, 194, 128, 0.88)', border: '#CDB075' },    // 暖米黃
            '午餐': { bg: 'rgba(143, 169, 152, 0.88)', border: '#7A9482' },    // 鼠尾草綠
            '晚餐': { bg: 'rgba(125, 116, 109, 0.88)', border: '#665F59' },    // 冷茶灰
            '宵夜': { bg: 'rgba(163, 144, 162, 0.88)', border: '#8A7689' },    // 薰衣草灰
            '點心/其他': { bg: 'rgba(200, 194, 188, 0.82)', border: '#AFA8A2' } // 柔霧暖灰
        };

        let datasets = [];

        if (currentMealFilter === 'all') {
            // 整日總計模式：早、午、晚、宵夜、點心分層堆疊
            ['早餐', '午餐', '晚餐', '宵夜', '點心/其他'].forEach(meal => {
                datasets.push({
                    type: 'bar',
                    label: meal,
                    data: dayList.map(d => isCal ? (d.meals[meal]?.cal || 0) : (d.meals[meal]?.pro || 0)),
                    backgroundColor: earthPalette[meal].bg,
                    borderColor: earthPalette[meal].border,
                    borderWidth: 1,
                    stack: 'dailyStack',
                    borderRadius: 4,
                    maxBarThickness: 28
                });
            });
        } else {
            // 單餐篩選模式
            const selectedMeal = currentMealFilter;
            datasets.push({
                type: 'bar',
                label: `${selectedMeal}${metricTitle}`,
                data: dayList.map(d => isCal ? (d.meals[selectedMeal]?.cal || 0) : (d.meals[selectedMeal]?.pro || 0)),
                backgroundColor: earthPalette[selectedMeal]?.bg || 'rgba(143, 169, 152, 0.88)',
                borderColor: earthPalette[selectedMeal]?.border || '#7A9482',
                borderWidth: 1,
                borderRadius: 5,
                maxBarThickness: 28
            });
        }

        // 計算區間每日總平均值
        const totals = dayList.map(d => {
            if (currentMealFilter === 'all') {
                return isCal ? d.totalCal : d.totalPro;
            } else {
                return isCal ? (d.meals[currentMealFilter]?.cal || 0) : (d.meals[currentMealFilter]?.pro || 0);
            }
        }).filter(v => v > 0);

        const avg = totals.length > 0 ? Math.round(totals.reduce((a, b) => a + b, 0) / totals.length) : 0;
        document.getElementById('chart-avg-text').textContent = `區間日均：約 ${avg} ${metricUnit}`;

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        display: (currentMealFilter === 'all'),
                        position: 'top',
                        labels: { boxWidth: 10, font: { size: 10, family: 'PingFang TC' }, padding: 8 }
                    },
                    tooltip: {
                        backgroundColor: '#2D2B2A',
                        padding: 8,
                        titleFont: { size: 12 },
                        bodyFont: { size: 11 },
                        callbacks: {
                            label: function(context) {
                                if (context.parsed.y === 0) return null;
                                return ` ${context.dataset.label}: ${context.parsed.y} ${metricUnit}`;
                            },
                            afterBody: function(contexts) {
                                if (currentMealFilter === 'all') {
                                    const total = contexts.reduce((sum, item) => sum + item.parsed.y, 0);
                                    return `──────\n當日總計: ${total} ${metricUnit}`;
                                }
                                return '';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        grid: { display: false },
                        ticks: { font: { size: 11, family: 'PingFang TC' }, color: '#78716c' }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        grid: { color: 'rgba(0, 0, 0, 0.04)' },
                        ticks: { font: { size: 10 }, color: '#78716c' },
                        title: { display: true, text: metricUnit, font: { size: 10 } }
                    }
                }
            }
        });
    }

    async function handleTextImport() {
        const text = document.getElementById('import-text').value;
        if (!text.trim()) { alert('請先貼上資料。'); return; }
        
        const batch = db.batch();
        let addedCount = 0; 
        let updatedCount = 0;
        const lines = text.split('\n');

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
            if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);
            
            let row = [];
            if (cleanLine.includes('|')) {
                row = cleanLine.split('|').map(s => s.trim());
            } else {
                const parsed = Papa.parse(cleanLine);
                if (parsed.data && parsed.data.length > 0) row = parsed.data[0].map(s => s.trim());
            }

            if (row.length < 3) return; 

            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                let category = '點心/其他'; let timeStr = '15:00';
                
                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }
                
                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                const content = row[2] || '未紀錄內容';
                let calories = 0, protein = 0, analysis = '', advice = '';
                
                if (row.length >= 7 && !isNaN(parseInt(row[3]))) {
                    calories = parseInt(row[3]) || 0;
                    protein = parseInt(row[4]) || 0;
                    analysis = row[5] || '';
                    advice = row[6] || '';
                } else {
                    analysis = row[3] || '';
                    advice = row[4] || '';
                }
                
                const newEntry = {
                    id: 'import_' + Date.now() + Math.random().toString(36).substring(7),
                    type: content.includes('水') && !content.includes('餃') && !content.includes('果') ? 'water' : 'meal',
                    category: category, 
                    title: content, 
                    calories: calories,
                    protein: protein,
                    analysis: analysis, 
                    advice: advice, 
                    timestamp: timestamp
                };

                const firebaseData = {
                    type: newEntry.category,
                    title: newEntry.title,
                    calories: newEntry.calories,
                    protein: newEntry.protein,
                    analysis: newEntry.analysis,
                    advice: newEntry.advice,
                    createdAt: firebase.firestore.Timestamp.fromDate(new Date(newEntry.timestamp))
                };

                const existingIndex = state.entries.findIndex(e => e.timestamp.startsWith(dateStr) && e.category === category && e.type === 'meal');

                if (existingIndex !== -1 && newEntry.type === 'meal') {
                    newEntry.id = state.entries[existingIndex].id;
                    state.entries[existingIndex] = newEntry; 
                    const docRef = db.collection('diet_records').doc(newEntry.id);
                    batch.set(docRef, firebaseData, { merge: true });
                    updatedCount++;
                } else {
                    const docRef = db.collection('diet_records').doc(newEntry.id);
                    batch.set(docRef, firebaseData);
                    state.entries.push(newEntry); 
                    addedCount++;
                }
            }
        });
        
        if (addedCount > 0 || updatedCount > 0) {
            try {
                document.getElementById('import-text').value = '手帳更新中...';
                await batch.commit();
                saveData();
                alert(`同步完成！\n新增：${addedCount} 筆\n更新：${updatedCount} 筆`);
                location.reload();
            } catch (error) {
                console.error("寫入失敗:", error);
                alert("同步失敗，請確認網路連線。");
            }
        } else {
            alert('未讀取到有效的表格格式。');
        }
    }

    function exportData() {
        const backupData = { meals: state.entries, scale: state.scaleData };
        const dataStr = JSON.stringify(backupData, null, 2); 
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const exportFileDefaultName = `diet_journal_${new Date().toISOString().split('T')[0]}.json`;
        let linkElement = document.createElement('a');
        linkElement.setAttribute('href', url);
        linkElement.setAttribute('download', exportFileDefaultName);
        document.body.appendChild(linkElement); 
        linkElement.click();
        document.body.removeChild(linkElement);
        URL.revokeObjectURL(url); 
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(importedData.meals) {
                    state.entries = importedData.meals;
                    state.scaleData = importedData.scale || [];
                } else if (Array.isArray(importedData)) {
                    state.entries = importedData;
                }
                saveData();
                localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
                alert('手帳資料已成功還原！');
                location.reload();
            } catch (err) { alert('檔案格式不正確。'); }
        };
        reader.readAsText(file);
    }

    function saveData() { localStorage.setItem('diet_entries_v4', JSON.stringify(state.entries)); }

    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        let totalWater = 0; let totalCals = 0; let totalProtein = 0;
        
        todayEntries.forEach(e => { 
            if (e.type === 'water') totalWater += (e.amount || 0); 
            if (e.type === 'meal') {
                totalCals += (e.calories || 0);
                totalProtein += (e.protein || 0);
            }
        });
        
        document.getElementById('total-cals').textContent = totalCals;
        document.getElementById('total-protein').textContent = totalProtein;
        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPercentage = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPercentage}%`;
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const sortedEntries = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (sortedEntries.length === 0) {
            container.innerHTML = `<div class="text-center py-16 text-stone-400 text-base font-medium"><i class="ph ph-notebook text-4xl mb-3 text-stone-300"></i><p>手帳尚無內容，可透過 LINE 傳送或手動新增。</p></div>`;
            return;
        }

        function getWeekKey(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff)).getTime();
        }

        const weeks = new Map();

        sortedEntries.forEach((entry, index) => {
            const entryDate = new Date(entry.timestamp);
            const weekKey = getWeekKey(entryDate);
            const dateStr = entryDate.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
            
            if (!weeks.has(weekKey)) {
                weeks.set(weekKey, { totalCals: 0, totalProtein: 0, days: new Map(), start: weekKey });
            }
            
            const weekObj = weeks.get(weekKey);
            if (!weekObj.days.has(dateStr)) {
                weekObj.days.set(dateStr, { cals: 0, protein: 0, entries: [] });
            }
            
            const dayObj = weekObj.days.get(dateStr);
            dayObj.entries.push({ entry, index }); 
            
            if (entry.type === 'meal') {
                const cals = parseInt(entry.calories) || 0;
                const prot = parseInt(entry.protein) || 0;
                weekObj.totalCals += cals;
                weekObj.totalProtein += prot;
                dayObj.cals += cals;
                dayObj.protein += prot;
            }
        });

        let htmlContent = '';

        Array.from(weeks.values()).sort((a, b) => b.start - a.start).forEach(week => {
            const startDate = new Date(week.start);
            const endDate = new Date(week.start);
            endDate.setDate(endDate.getDate() + 6);
            const weekLabel = `${startDate.getMonth()+1}/${startDate.getDate()} - ${endDate.getMonth()+1}/${endDate.getDate()}`;
            
            htmlContent += `
            <div class="mb-6 p-5 bg-stone-50 rounded-xl border border-stone-200/80 text-stone-700">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-bold text-stone-500 flex items-center gap-2">
                        <i class="ph ph-calendar text-base"></i> 當週小結
                    </span>
                    <span class="text-sm text-stone-400 font-medium">${weekLabel}</span>
                </div>
                <div class="flex gap-8 mt-2">
                    <div>
                        <span class="text-xs text-stone-400">總攝取：</span>
                        <span class="text-base font-bold text-stone-800">${week.totalCals} 大卡</span>
                    </div>
                    <div>
                        <span class="text-xs text-stone-400">總蛋白質：</span>
                        <span class="text-base font-bold text-stone-800">${week.totalProtein} 克</span>
                    </div>
                </div>
            </div>`;
            
            Array.from(week.days.entries()).forEach(([dateStr, day]) => {
                htmlContent += `
                <div class="flex justify-between items-center pt-4 pb-2 mb-3 border-b border-stone-100">
                    <span class="text-sm font-bold text-stone-600 bg-stone-100 px-3 py-1.5 rounded-md">${dateStr}</span>
                    <div class="flex gap-4 text-sm text-stone-500 font-medium">
                        <span>${day.cals} 大卡</span>
                        <span>${day.protein}g 蛋白質</span>
                    </div>
                </div>`;
                
                day.entries.forEach(({ entry }) => {
                    const timeString = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                    
                    if (entry.type === 'water') {
                        htmlContent += `
                        <div class="flex items-center gap-3 p-4 bg-white border border-stone-100 rounded-xl shadow-xs mb-3 group relative pr-12">
                            <div class="w-10 h-10 rounded-lg bg-stone-50 flex items-center justify-center text-amber-700">
                                <i class="ph ph-drop text-xl"></i>
                            </div>
                            <div class="flex-1 flex justify-between items-center">
                                <span class="text-sm font-medium text-stone-700">補充水分</span>
                                <span class="text-sm font-bold text-stone-600">+${entry.amount} ml</span>
                            </div>
                            <button onclick="deleteEntry('${entry.id}')" class="absolute right-3 top-1/2 -translate-y-1/2 text-rose-300 hover:text-rose-500 hover:bg-rose-50 rounded-md p-1.5 transition-colors">
                                <i class="ph ph-trash text-lg"></i>
                            </button>
                        </div>`;
                    } else {
                        const contextHtml = entry.context ? `<span class="text-xs bg-stone-100 text-stone-600 px-2.5 py-1 rounded-md mr-2 font-normal">${entry.context}</span>` : '';
                        
                        let nutritionHtml = '';
                        if (entry.calories > 0 || entry.protein > 0) {
                            nutritionHtml = `<div class="text-sm text-stone-500 mt-2 space-x-3">`;
                            if (entry.calories > 0) nutritionHtml += `<span>約 ${entry.calories} 大卡</span>`;
                            if (entry.protein > 0) nutritionHtml += `<span>• 蛋白質 ${entry.protein}g</span>`;
                            nutritionHtml += `</div>`;
                        }
                        
                        let notesHtml = '';
                        if (entry.analysis || entry.advice) {
                            notesHtml = `<div class="mt-4 p-4 bg-stone-50/80 rounded-xl text-sm space-y-2 border border-stone-100/60 leading-relaxed text-stone-600">`;
                            if (entry.analysis) notesHtml += `<p><span class="font-bold text-stone-700">💡 營養觀察：</span>${entry.analysis}</p>`;
                            if (entry.advice) notesHtml += `<p><span class="font-bold text-stone-700">🥗 微調建議：</span>${entry.advice}</p>`;
                            notesHtml += `</div>`;
                        }

                        htmlContent += `
                        <div class="p-5 bg-white border border-stone-200 rounded-xl shadow-xs mb-4 relative transition hover:border-stone-300">
                            <div class="flex justify-between items-start mb-2 pr-8">
                                <div class="flex items-center gap-3">
                                    <span class="text-sm font-bold text-stone-700 bg-stone-100 px-2.5 py-1 rounded-md">${entry.category}</span>
                                    <span class="text-sm text-stone-400">${timeString}</span>
                                </div>
                            </div>
                            
                            <button onclick="deleteEntry('${entry.id}')" class="absolute right-4 top-4 text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg p-1.5 transition-colors" title="刪除紀錄">
                                <i class="ph ph-trash text-lg"></i>
                            </button>

                            <h3 class="text-base font-bold text-stone-800 mt-2">${entry.title}</h3>
                            <div class="mt-2">${contextHtml}</div>
                            ${nutritionHtml}
                            ${notesHtml}
                        </div>`;
                    }
                });
            });
        });
        
        container.innerHTML = htmlContent;
    }

    function closeModal(modalId) {
        const m = document.getElementById(modalId);
        m.classList.add('opacity-0'); 
        setTimeout(() => { m.classList.add('hidden'); }, 200);
    }

    document.getElementById('entry-modal').addEventListener('click', (e) => { if (e.target.id === 'entry-modal') closeModal('entry-modal'); });
    document.getElementById('data-modal').addEventListener('click', (e) => { if (e.target.id === 'data-modal') closeModal('data-modal'); });
    document.getElementById('scale-modal').addEventListener('click', (e) => { if (e.target.id === 'scale-modal') closeModal('scale-modal'); });
</script>
</body>
</html>

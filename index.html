<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的日常飲食手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FBF9F5',
                        surface: '#FFFFFF',
                        oat: '#F4EFE6',
                        'oat-dark': '#C9A982',
                        sage: '#6E8B74',
                        'sage-soft': '#EEF3EF',
                        ink: '#2E2C29',
                        muted: '#8A847C'
                    },
                    boxShadow: {
                        'soft': '0 4px 24px -4px rgba(46, 44, 41, 0.04)',
                        'float': '0 10px 30px -6px rgba(46, 44, 41, 0.16)'
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        body {
            background-color: #FBF9F5;
            color: #2E2C29;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.01em;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 卡片展開動畫 */
        .note-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.28s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .note-drawer.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .note-drawer > div {
            overflow: hidden;
        }
        .chevron-icon {
            transition: transform 0.25s ease;
        }
        .chevron-icon.rotated {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="antialiased selection:bg-sage-soft selection:text-sage">

<div class="max-w-5xl mx-auto min-h-screen relative px-4 pt-5 pb-28 md:p-8 flex flex-col md:flex-row gap-6 md:gap-8">

    <!-- 左側：今日概況與體態 -->
    <div class="w-full md:w-80 flex-shrink-0 md:sticky md:top-8 h-fit space-y-5">

        <!-- 今日概況卡片（去框中框、大留白） -->
        <header class="p-6 bg-surface rounded-3xl shadow-soft">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-xs text-muted font-medium tracking-wide" id="current-date">載入中...</p>
                    <h1 class="text-2xl font-bold text-ink tracking-tight mt-1">今日飲食手帳</h1>
                </div>
                <button onclick="openDataModal()" class="p-2.5 text-muted hover:text-ink hover:bg-oat rounded-2xl transition" title="資料管理與匯入">
                    <i class="ph ph-sliders-horizontal text-xl"></i>
                </button>
            </div>

            <!-- 熱量與蛋白質主數字 -->
            <div class="grid grid-cols-2 gap-4 pb-6">
                <div>
                    <p class="text-xs text-muted mb-1.5">今日熱量</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold tracking-tight text-ink" id="total-cals">0</span>
                        <span class="text-xs text-muted">大卡</span>
                    </div>
                </div>
                <div>
                    <p class="text-xs text-muted mb-1.5">蛋白質</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold tracking-tight text-sage" id="total-protein">0</span>
                        <span class="text-xs text-muted">公克</span>
                    </div>
                </div>
            </div>

            <!-- 溫和進度條區：蛋白質 + 水分 -->
            <div class="space-y-4 py-5 border-y border-stone-100">
                <!-- 蛋白質進度條（鼠尾草綠） -->
                <div>
                    <div class="flex justify-between items-center text-xs mb-2">
                        <span class="text-ink/80 font-medium flex items-center gap-1.5">
                            <i class="ph-fill ph-leaf text-sage text-sm"></i> 蛋白質目標
                        </span>
                        <span id="protein-status" class="text-sage font-medium">還差 70g</span>
                    </div>
                    <div class="w-full bg-sage-soft rounded-full h-2 overflow-hidden">
                        <div class="bg-sage h-2 rounded-full transition-all duration-500" id="protein-bar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 水分進度條（暖燕麥色） -->
                <div>
                    <div class="flex justify-between items-center text-xs mb-2">
                        <span class="text-ink/80 font-medium flex items-center gap-1.5">
                            <i class="ph-fill ph-drop text-oat-dark text-sm"></i> 每日水分
                        </span>
                        <span id="water-text" class="text-muted font-medium">0 / 2000 ml</span>
                    </div>
                    <div class="w-full bg-oat rounded-full h-2 overflow-hidden">
                        <div class="bg-oat-dark h-2 rounded-full transition-all duration-500" id="water-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 最新體態（極簡純數字＋細分隔線） -->
            <div class="mt-5 cursor-pointer group" onclick="openScaleModal()">
                <div class="flex items-center justify-between mb-3.5">
                    <span class="text-xs font-semibold text-ink/70 flex items-center gap-1.5">
                        <i class="ph ph-scales text-muted text-base"></i> 最新體態
                    </span>
                    <span id="scale-date" class="text-xs text-muted group-hover:text-sage transition flex items-center gap-1">
                        點擊更新 <i class="ph ph-caret-right text-[11px]"></i>
                    </span>
                </div>
                <div class="grid grid-cols-3 divide-x divide-stone-200/60 text-center py-1">
                    <div class="px-1">
                        <p class="text-[11px] text-muted">體重</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-weight">-</p>
                    </div>
                    <div class="px-1">
                        <p class="text-[11px] text-muted">體脂率</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-fat">-</p>
                    </div>
                    <div class="px-1">
                        <p class="text-[11px] text-muted">腰圍</p>
                        <p class="font-semibold text-base text-ink mt-1" id="display-waist">-</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- 桌機版快速紀錄（手機版已整合到底部懸浮膠囊列，但保留快速餐別點選） -->
        <div class="hidden md:block bg-surface p-5 rounded-3xl shadow-soft">
            <h2 class="text-xs font-semibold text-muted mb-3.5 px-1 tracking-wider">快速紀錄</h2>
            <div class="grid grid-cols-4 gap-2.5">
                <button onclick="openModal('meal', '早餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-coffee text-xl mb-1 text-oat-dark"></i>
                    <span class="text-xs font-medium">早餐</span>
                </button>
                <button onclick="openModal('meal', '午餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-bowl-food text-xl mb-1 text-sage"></i>
                    <span class="text-xs font-medium">午餐</span>
                </button>
                <button onclick="openModal('meal', '晚餐')" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-cooking-pot text-xl mb-1 text-stone-500"></i>
                    <span class="text-xs font-medium">晚餐</span>
                </button>
                <button onclick="addWater()" class="flex flex-col items-center justify-center py-3.5 bg-paper hover:bg-oat text-ink rounded-2xl transition active:scale-95">
                    <i class="ph ph-drop text-xl mb-1 text-oat-dark"></i>
                    <span class="text-xs font-medium">+250ml</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側：趨勢圖表與飲食時間軸 -->
    <div class="flex-1 w-full space-y-6">

        <!-- 趨勢分析卡片（柔和粉質純柱狀圖） -->
        <section id="trend-section" class="bg-surface rounded-3xl shadow-soft p-5 md:p-7">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                <div>
                    <h2 class="text-base font-bold text-ink flex items-center gap-2">
                        <i class="ph ph-chart-bar text-xl text-sage"></i> 近期飲食節奏
                    </h2>
                    <p class="text-xs text-muted mt-0.5">點擊柱子可查看當日明細</p>
                </div>

                <!-- 指標切換 + 天數下拉選單 -->
                <div class="flex items-center gap-2">
                    <div class="flex bg-paper p-1 rounded-full">
                        <button onclick="setChartMetric('calories')" id="metric-cal-btn" class="text-xs font-medium px-3 py-1.5 rounded-full bg-surface text-ink shadow-xs transition">熱量</button>
                        <button onclick="setChartMetric('protein')" id="metric-pro-btn" class="text-xs font-medium px-3 py-1.5 rounded-full text-muted hover:text-ink transition">蛋白質</button>
                    </div>
                    <select id="chart-range-select" onchange="setChartRange(this.value)" class="text-xs font-medium bg-paper text-ink px-3 py-2 rounded-full outline-none cursor-pointer border-0">
                        <option value="7">近 7 天</option>
                        <option value="14" selected>近 14 天</option>
                        <option value="30">近 30 天</option>
                        <option value="all">全部</option>
                    </select>
                </div>
            </div>

            <div class="relative w-full h-56 md:h-64">
                <canvas id="dietTrendChart"></canvas>
            </div>
        </section>

        <!-- 飲食紀錄時間軸 -->
        <section class="bg-surface rounded-3xl shadow-soft p-5 md:p-7 min-h-[60vh]">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                <h2 class="text-base font-bold text-ink flex items-center gap-2">
                    <i class="ph ph-book-open-text text-xl text-oat-dark"></i> 飲食日記
                </h2>

                <!-- 特定日期快搜 -->
                <div class="flex items-center gap-2">
                    <div class="relative flex items-center">
                        <input type="date" id="date-search-input" onchange="handleDateSearch(this.value)" class="text-xs bg-paper text-ink px-3.5 py-2 rounded-full outline-none cursor-pointer">
                    </div>
                    <button id="clear-date-btn" onclick="clearDateSearch()" class="hidden text-xs text-muted hover:text-ink bg-oat px-3 py-2 rounded-full transition">
                        顯示全部
                    </button>
                </div>
            </div>

            <!-- 橫向藥丸餐別篩選列 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-5 hide-scrollbar" id="timeline-filter-bar">
                <button onclick="setTimelineFilter('all')" data-cat="all" class="tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-ink text-paper transition">全部</button>
                <button onclick="setTimelineFilter('早餐')" data-cat="早餐" class="tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">早餐</button>
                <button onclick="setTimelineFilter('午餐')" data-cat="午餐" class="tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">午餐</button>
                <button onclick="setTimelineFilter('晚餐')" data-cat="晚餐" class="tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">晚餐</button>
                <button onclick="setTimelineFilter('宵夜')" data-cat="宵夜" class="tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition">宵夜</button>
            </div>

            <div id="timeline-container" class="space-y-6"></div>

            <!-- 分頁載入按鈕 -->
            <div id="load-more-wrapper" class="hidden text-center pt-6">
                <button onclick="loadMoreDays()" class="text-xs font-medium text-muted hover:text-ink bg-paper hover:bg-oat px-5 py-2.5 rounded-full transition">
                    載入更早的紀錄
                </button>
            </div>
        </section>
    </div>
</div>

<!-- 手機拇指區：半透明霧面懸浮膠囊快捷列 -->
<nav class="fixed bottom-5 left-1/2 -translate-x-1/2 md:hidden z-30 flex items-center gap-1.5 px-2.5 py-2 rounded-full bg-[#2E2C29]/90 backdrop-blur-md text-[#FBF9F5] shadow-float">
    <button onclick="openModal('meal', '午餐')" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-sage text-white text-xs font-semibold active:scale-95 transition">
        <i class="ph-bold ph-plus text-sm"></i> 記一餐
    </button>
    <button onclick="addWater()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full hover:bg-white/10 text-xs font-medium active:scale-95 transition">
        <i class="ph ph-drop text-base text-oat-dark"></i> +250ml
    </button>
    <button onclick="scrollToTrend()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full hover:bg-white/10 text-xs font-medium active:scale-95 transition">
        <i class="ph ph-chart-bar text-base text-stone-300"></i> 看趨勢
    </button>
</nav>

<!-- 柔和提示條 (Toast) -->
<div id="toast-container" class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-2">
    <div class="bg-[#2E2C29]/92 backdrop-blur-md text-[#FBF9F5] text-xs font-medium px-4 py-2.5 rounded-full shadow-float flex items-center gap-2 whitespace-nowrap">
        <i id="toast-icon" class="ph-fill ph-check-circle text-sage text-base"></i>
        <span id="toast-message">已儲存</span>
    </div>
</div>

<!-- 體態彈窗 -->
<div id="scale-modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-xs z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-surface w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl" id="scale-modal-content">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-ink">更新體態數據</h3>
            <button onclick="closeModal('scale-modal')" class="p-2 text-muted hover:text-ink rounded-full bg-paper">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-muted mb-1.5">體重 (kg)</label>
                <input type="number" step="0.1" id="input-weight" placeholder="例如：72.5" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5">體脂率 (%) 選填</label>
                    <input type="number" step="0.1" id="input-fat" placeholder="-" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5">腰圍 (cm) 選填</label>
                    <input type="number" step="0.1" id="input-waist" placeholder="-" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
            </div>
            <button onclick="saveScaleData()" class="w-full bg-ink text-paper font-medium rounded-2xl py-3.5 text-sm hover:opacity-90 transition mt-2">
                儲存紀錄
            </button>
        </div>
    </div>
</div>

<!-- 飲食手動新增彈窗 -->
<div id="entry-modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-xs z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-surface w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-7 shadow-xl" id="modal-content">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-ink" id="modal-title">記一餐</h3>
            <button onclick="closeModal('entry-modal')" class="p-2 text-muted hover:text-ink rounded-full bg-paper">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="space-y-4">
            <!-- 餐別快速切換 -->
            <div class="flex gap-1.5 flex-wrap" id="modal-category-pills">
                <button type="button" onclick="selectModalCategory('早餐')" data-mcat="早餐" class="mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition">早餐</button>
                <button type="button" onclick="selectModalCategory('午餐')" data-mcat="午餐" class="mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition">午餐</button>
                <button type="button" onclick="selectModalCategory('晚餐')" data-mcat="晚餐" class="mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition">晚餐</button>
                <button type="button" onclick="selectModalCategory('宵夜')" data-mcat="宵夜" class="mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition">宵夜</button>
                <button type="button" onclick="selectModalCategory('點心/其他')" data-mcat="點心/其他" class="mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition">點心</button>
            </div>
            <input type="hidden" id="entry-type" value="午餐">

            <div>
                <label class="block text-xs font-medium text-muted mb-1.5">吃了什麼</label>
                <input type="text" id="entry-content" placeholder="例如：手撕雞餐盒、少飯" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-muted mb-1.5">備註 / 身體感覺（選填）</label>
                <input type="text" id="entry-context" placeholder="例如：八分飽、飯後不累" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5">估算熱量 (大卡)</label>
                    <input type="number" id="entry-cals" placeholder="選填" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5">蛋白質 (克)</label>
                    <input type="number" id="entry-protein" placeholder="選填" class="w-full bg-paper rounded-2xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-sage/30 transition">
                </div>
            </div>
            <button onclick="saveEntry()" class="w-full bg-sage text-white font-medium rounded-2xl py-3.5 text-sm hover:opacity-90 transition mt-2">
                加入手帳
            </button>
        </div>
    </div>
</div>

<!-- 資料管理彈窗 -->
<div id="data-modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-xs z-50 hidden opacity-0 transition-opacity duration-200 flex items-end sm:items-center justify-center">
    <div class="bg-surface w-full max-w-md rounded-t-3xl sm:rounded-3xl p-7 shadow-xl overflow-y-auto max-h-[85vh]" id="data-modal-content">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-stone-100">
            <h3 class="text-lg font-bold text-ink">資料管理與備份</h3>
            <button onclick="closeModal('data-modal')" class="p-2 text-muted hover:text-ink rounded-full bg-paper">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <div class="space-y-6">
            <div>
                <h4 class="text-sm font-bold text-ink mb-1">貼上 Markdown 筆記同步</h4>
                <p class="text-xs text-muted mb-3 leading-relaxed">把整理好的飲食表格貼在下方，會自動整理並同步到雲端。</p>
                <textarea id="import-text" rows="4" class="w-full p-4 text-xs bg-paper rounded-2xl outline-none focus:ring-2 focus:ring-sage/30 resize-none" placeholder="貼上表格內容..."></textarea>
                <button onclick="handleTextImport()" class="w-full mt-3 py-3 bg-ink text-paper text-sm font-medium rounded-2xl hover:opacity-90 transition">
                    執行同步更新
                </button>
            </div>

            <div class="pt-4 border-t border-stone-100">
                <h4 class="text-sm font-bold text-ink mb-3">備份與重置</h4>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportData()" class="p-3 bg-paper hover:bg-oat rounded-2xl text-xs text-ink font-medium text-center transition">
                        匯出備份 (JSON)
                    </button>
                    <input type="file" id="json-upload" accept=".json" class="hidden" onchange="handleJSONImport(event)">
                    <button onclick="document.getElementById('json-upload').click()" class="p-3 bg-paper hover:bg-oat rounded-2xl text-xs text-ink font-medium text-center transition">
                        還原備份
                    </button>
                </div>
                <button onclick="clearAllData()" class="w-full mt-4 p-3 text-rose-500 hover:bg-rose-50 rounded-2xl text-xs font-medium transition text-center">
                    清空所有歷史紀錄
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC263lrmHJICThOoMlR4JacvnIJJ6ExxzA",
        authDomain: "diet-tracker-20260819.firebaseapp.com",
        projectId: "diet-tracker-20260819",
        storageBucket: "diet-tracker-20260819.firebasestorage.app",
        messagingSenderId: "574990158319",
        appId: "1:574990158319:web:358b8326ec7b4809c7ce1a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let state = {
        entries: JSON.parse(localStorage.getItem('diet_entries_v4')) || [],
        scaleData: JSON.parse(localStorage.getItem('scale_entries_v2')) || []
    };

    const DAILY_WATER_GOAL = 2000;
    const DAILY_PROTEIN_GOAL = 70;

    let chartInstance = null;
    let currentChartMetric = 'calories'; // 'calories' | 'protein'
    let currentChartRange = '14';        // '7' | '14' | '30' | 'all'
    let currentTimelineFilter = 'all';   // 'all' | '早餐' | '午餐' | '晚餐' | '宵夜'
    let selectedSearchDate = '';         // 'YYYY-MM-DD'
    let visibleDaysLimit = 14;
    let toastTimer = null;

    // 柔和提示條
    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        msgEl.textContent = message;
        iconEl.className = isError
            ? 'ph-fill ph-warning-circle text-rose-400 text-base'
            : 'ph-fill ph-check-circle text-sage text-base';

        container.classList.remove('opacity-0', 'translate-y-2');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            container.classList.add('opacity-0', 'translate-y-2');
        }, 2200);
    }

    function scrollToTrend() {
        const el = document.getElementById('trend-section');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function syncFromFirebase() {
        try {
            const snapshot = await db.collection('diet_records').get();
            const cloudData = [];

            snapshot.forEach(doc => {
                const data = doc.data();
                let timeStr = new Date().toISOString();
                if (data.createdAt) {
                    if (typeof data.createdAt.toDate === 'function') {
                        timeStr = data.createdAt.toDate().toISOString();
                    } else {
                        timeStr = new Date(data.createdAt).toISOString();
                    }
                }

                cloudData.push({
                    id: doc.id,
                    type: 'meal',
                    category: data.type || '晚餐',
                    title: data.title || '未命名餐點',
                    calories: parseInt(data.calories) || 0,
                    protein: parseInt(data.protein) || 0,
                    analysis: data.analysis || '',
                    advice: data.advice || '',
                    context: data.context || '',
                    timestamp: timeStr
                });
            });

            const combined = [...cloudData, ...state.entries];
            const uniqueEntries = Array.from(new Map(combined.map(item => [item.id, item])).values());
            state.entries = uniqueEntries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveData();
            renderDashboard();
            renderTimeline();
            renderChart();
        } catch (error) {
            console.error("Firebase 讀取失敗:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateDate();
        renderDashboard();
        renderTimeline();
        renderScaleData();
        renderChart();
        syncFromFirebase();
    });

    function updateDate() {
        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', options);
    }

    // ==========================================
    // 柔和粉質系純柱狀趨勢圖
    // ==========================================
    function setChartMetric(metric) {
        currentChartMetric = metric;
        const calBtn = document.getElementById('metric-cal-btn');
        const proBtn = document.getElementById('metric-pro-btn');
        if (metric === 'calories') {
            calBtn.className = 'text-xs font-medium px-3 py-1.5 rounded-full bg-surface text-ink shadow-xs transition';
            proBtn.className = 'text-xs font-medium px-3 py-1.5 rounded-full text-muted hover:text-ink transition';
        } else {
            proBtn.className = 'text-xs font-medium px-3 py-1.5 rounded-full bg-surface text-sage shadow-xs transition';
            calBtn.className = 'text-xs font-medium px-3 py-1.5 rounded-full text-muted hover:text-ink transition';
        }
        renderChart();
    }

    function setChartRange(range) {
        currentChartRange = range;
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('dietTrendChart');
        if (!ctx) return;

        const dailyMap = new Map();
        const sortedAsc = [...state.entries]
            .filter(e => e.type === 'meal')
            .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        sortedAsc.forEach(e => {
            const d = new Date(e.timestamp);
            const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const label = `${d.getMonth() + 1}/${d.getDate()}`;

            if (!dailyMap.has(dateKey)) {
                dailyMap.set(dateKey, {
                    label,
                    meals: {
                        '早餐': { cal: 0, pro: 0 },
                        '午餐': { cal: 0, pro: 0 },
                        '晚餐': { cal: 0, pro: 0 },
                        '宵夜': { cal: 0, pro: 0 },
                        '點心/其他': { cal: 0, pro: 0 }
                    }
                });
            }

            const item = dailyMap.get(dateKey);
            let cat = '點心/其他';
            if (e.category && e.category.includes('早')) cat = '早餐';
            else if (e.category && e.category.includes('午')) cat = '午餐';
            else if (e.category && e.category.includes('晚')) cat = '晚餐';
            else if (e.category && (e.category.includes('宵夜') || e.category.includes('夜'))) cat = '宵夜';

            item.meals[cat].cal += parseInt(e.calories) || 0;
            item.meals[cat].pro += parseInt(e.protein) || 0;
        });

        let dayList = Array.from(dailyMap.values());
        if (currentChartRange !== 'all') {
            const limit = parseInt(currentChartRange);
            dayList = dayList.slice(-limit);
        }

        const labels = dayList.map(d => d.label);
        const field = currentChartMetric === 'calories' ? 'cal' : 'pro';

        // 低飽和療癒粉質配色
        const pastelColors = {
            '早餐': '#E5C6A0',     // 暖燕麥
            '午餐': '#8FB096',     // 鼠尾草綠
            '晚餐': '#B5A89D',     // 暖焙灰棕
            '宵夜': '#C7B8C9',     // 淡薰衣草灰
            '點心/其他': '#DCD6CE' // 淺砂岩
        };

        const datasets = ['早餐', '午餐', '晚餐', '宵夜', '點心/其他'].map(meal => ({
            label: meal,
            data: dayList.map(d => d.meals[meal][field]),
            backgroundColor: pastelColors[meal],
            borderRadius: 4,
            borderSkipped: false,
            stack: 'meals',
            maxBarThickness: 28
        }));

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 10,
                            boxHeight: 10,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            padding: 14,
                            color: '#8A847C',
                            font: { size: 11 }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(46, 44, 41, 0.92)',
                        padding: 12,
                        cornerRadius: 12,
                        titleFont: { size: 12 },
                        bodyFont: { size: 12 },
                        callbacks: {
                            footer: (items) => {
                                const sum = items.reduce((acc, i) => acc + i.parsed.y, 0);
                                const unit = currentChartMetric === 'calories' ? '大卡' : 'g';
                                return `當日總計：${sum} ${unit}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        grid: { display: false },
                        border: { display: false },
                        ticks: { color: '#8A847C', font: { size: 11 } }
                    },
                    y: {
                        stacked: true,
                        border: { display: false },
                        grid: { color: 'rgba(46, 44, 41, 0.04)' },
                        ticks: { color: '#8A847C', font: { size: 11 } }
                    }
                }
            }
        });
    }

    // ==========================================
    // 體態與儀表板
    // ==========================================
    function openScaleModal() {
        const m = document.getElementById('scale-modal');
        if (state.scaleData.length > 0) {
            const latest = state.scaleData[0];
            document.getElementById('input-weight').value = latest.weight || '';
            document.getElementById('input-fat').value = latest.fat || '';
            document.getElementById('input-waist').value = latest.waist || '';
        } else {
            document.getElementById('input-weight').value = '';
            document.getElementById('input-fat').value = '';
            document.getElementById('input-waist').value = '';
        }
        m.classList.remove('hidden');
        setTimeout(() => m.classList.remove('opacity-0'), 10);
    }

    function saveScaleData() {
        const weight = parseFloat(document.getElementById('input-weight').value);
        const fat = parseFloat(document.getElementById('input-fat').value);
        const waist = parseFloat(document.getElementById('input-waist').value);

        if (!weight && !fat && !waist) {
            closeModal('scale-modal');
            return;
        }

        const newScaleEntry = {
            id: 'scale_' + Date.now(),
            date: new Date().toISOString().split('T')[0],
            weight: weight || 0,
            fat: fat || 0,
            waist: waist || 0
        };

        const todayIndex = state.scaleData.findIndex(e => e.date === newScaleEntry.date);
        if (todayIndex !== -1) state.scaleData[todayIndex] = newScaleEntry;
        else state.scaleData.unshift(newScaleEntry);

        localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
        closeModal('scale-modal');
        renderScaleData();
        showToast('已更新最新體態');
    }

    function renderScaleData() {
        if (state.scaleData.length === 0) return;
        const latest = state.scaleData[0];
        document.getElementById('display-weight').textContent = latest.weight ? `${latest.weight} kg` : '-';
        document.getElementById('display-fat').textContent = latest.fat ? `${latest.fat} %` : '-';
        document.getElementById('display-waist').textContent = latest.waist ? `${latest.waist} cm` : '-';
        const dateObj = new Date(latest.date);
        document.getElementById('scale-date').innerHTML = `${dateObj.getMonth() + 1}/${dateObj.getDate()} 紀錄 <i class="ph ph-caret-right text-[11px]"></i>`;
    }

    function renderDashboard() {
        const today = new Date().toDateString();
        const todayEntries = state.entries.filter(e => new Date(e.timestamp).toDateString() === today);
        let totalWater = 0, totalCals = 0, totalProtein = 0;

        todayEntries.forEach(e => {
            if (e.type === 'water') totalWater += (e.amount || 0);
            if (e.type === 'meal') {
                totalCals += (e.calories || 0);
                totalProtein += (e.protein || 0);
            }
        });

        document.getElementById('total-cals').textContent = totalCals;
        document.getElementById('total-protein').textContent = totalProtein;

        // 蛋白質進度條
        const proteinPct = Math.min((totalProtein / DAILY_PROTEIN_GOAL) * 100, 100);
        document.getElementById('protein-bar').style.width = `${proteinPct}%`;
        const remainPro = DAILY_PROTEIN_GOAL - totalProtein;
        document.getElementById('protein-status').textContent = remainPro > 0
            ? `還差 ${remainPro}g（目標 ${DAILY_PROTEIN_GOAL}g）`
            : `今日已達標（${totalProtein}g）`;

        // 水分進度條
        document.getElementById('water-text').textContent = `${totalWater} / ${DAILY_WATER_GOAL} ml`;
        const waterPct = Math.min((totalWater / DAILY_WATER_GOAL) * 100, 100);
        document.getElementById('water-bar').style.width = `${waterPct}%`;
    }

    // ==========================================
    // 時間軸篩選、日期快搜與卡片展開
    // ==========================================
    function setTimelineFilter(cat) {
        currentTimelineFilter = cat;
        document.querySelectorAll('.tl-pill').forEach(btn => {
            if (btn.dataset.cat === cat) {
                btn.className = 'tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-ink text-paper transition';
            } else {
                btn.className = 'tl-pill shrink-0 text-xs font-medium px-4 py-1.5 rounded-full bg-paper text-muted hover:text-ink transition';
            }
        });
        renderTimeline();
    }

    function handleDateSearch(dateVal) {
        selectedSearchDate = dateVal;
        const clearBtn = document.getElementById('clear-date-btn');
        if (dateVal) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
        renderTimeline();
    }

    function clearDateSearch() {
        selectedSearchDate = '';
        document.getElementById('date-search-input').value = '';
        document.getElementById('clear-date-btn').classList.add('hidden');
        renderTimeline();
    }

    function loadMoreDays() {
        visibleDaysLimit += 14;
        renderTimeline();
    }

    function toggleNote(id) {
        const drawer = document.getElementById(`note-drawer-${id}`);
        const chevron = document.getElementById(`note-chevron-${id}`);
        if (!drawer) return;
        drawer.classList.toggle('open');
        if (chevron) chevron.classList.toggle('rotated');
    }

    function getCategoryStyle(category) {
        if (!category) return 'bg-paper text-muted';
        if (category.includes('早')) return 'bg-oat text-[#8B6A44]';
        if (category.includes('午')) return 'bg-sage-soft text-sage';
        if (category.includes('晚')) return 'bg-stone-100 text-stone-600';
        if (category.includes('宵夜') || category.includes('夜')) return 'bg-[#F2EEF3] text-[#7A6A7E]';
        return 'bg-paper text-muted';
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const loadMoreWrapper = document.getElementById('load-more-wrapper');

        let filtered = [...state.entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (selectedSearchDate) {
            filtered = filtered.filter(e => {
                const d = new Date(e.timestamp);
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                return key === selectedSearchDate;
            });
        }

        if (currentTimelineFilter !== 'all') {
            filtered = filtered.filter(e => e.type === 'meal' && e.category && e.category.includes(currentTimelineFilter.replace('餐', '')));
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="text-center py-14 text-muted text-sm">
                    <i class="ph ph-notebook text-3xl mb-2 block text-stone-300"></i>
                    <p>${selectedSearchDate ? '這天沒有符合的飲食紀錄' : '目前還沒有紀錄，點下方按鈕就能輕鬆記一餐'}</p>
                </div>`;
            loadMoreWrapper.classList.add('hidden');
            return;
        }

        // 依日期分組
        const daysMap = new Map();
        filtered.forEach(entry => {
            const d = new Date(entry.timestamp);
            const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const dateLabel = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });

            if (!daysMap.has(dateKey)) {
                daysMap.set(dateKey, { label: dateLabel, cals: 0, protein: 0, entries: [] });
            }
            const dayObj = daysMap.get(dateKey);
            dayObj.entries.push(entry);
            if (entry.type === 'meal') {
                dayObj.cals += parseInt(entry.calories) || 0;
                dayObj.protein += parseInt(entry.protein) || 0;
            }
        });

        const allDays = Array.from(daysMap.values());
        const showDays = selectedSearchDate ? allDays : allDays.slice(0, visibleDaysLimit);

        if (!selectedSearchDate && allDays.length > visibleDaysLimit) {
            loadMoreWrapper.classList.remove('hidden');
        } else {
            loadMoreWrapper.classList.add('hidden');
        }

        let html = '';

        showDays.forEach(day => {
            html += `
            <div>
                <div class="flex justify-between items-center pb-2.5 mb-3 border-b border-stone-100">
                    <span class="text-xs font-semibold text-ink/70">${day.label}</span>
                    <div class="flex gap-3 text-xs text-muted">
                        <span>${day.cals} 大卡</span>
                        <span class="text-sage font-medium">${day.protein}g 蛋白</span>
                    </div>
                </div>
                <div class="space-y-3">`;

            day.entries.forEach(entry => {
                const timeStr = new Date(entry.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                if (entry.type === 'water') {
                    html += `
                    <div class="flex items-center justify-between px-4 py-3 bg-paper/80 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-oat flex items-center justify-center text-oat-dark">
                                <i class="ph-fill ph-drop text-sm"></i>
                            </span>
                            <div>
                                <span class="text-sm font-medium text-ink">補充水分</span>
                                <span class="text-xs text-muted ml-2">${timeStr}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-semibold text-oat-dark">+${entry.amount} ml</span>
                            <button onclick="deleteEntry('${entry.id}')" class="text-stone-300 hover:text-rose-400 p-1 transition" title="刪除">
                                <i class="ph ph-trash text-base"></i>
                            </button>
                        </div>
                    </div>`;
                } else {
                    const hasNotes = Boolean(entry.analysis || entry.advice);
                    const catStyle = getCategoryStyle(entry.category);
                    const safeId = entry.id.replace(/[^a-zA-Z0-9_-]/g, '');

                    html += `
                    <article class="p-4 sm:p-5 bg-paper/70 hover:bg-paper rounded-2xl transition">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${catStyle}">${entry.category}</span>
                                <span class="text-xs text-muted">${timeStr}</span>
                                ${entry.context ? `<span class="text-[11px] text-muted bg-surface px-2 py-0.5 rounded-full">${entry.context}</span>` : ''}
                            </div>
                            <button onclick="deleteEntry('${entry.id}')" class="text-stone-300 hover:text-rose-400 p-1 -mr-1 transition shrink-0" title="刪除紀錄">
                                <i class="ph ph-trash text-base"></i>
                            </button>
                        </div>

                        <h3 class="text-[15px] font-bold text-ink mt-2.5 leading-snug">${entry.title}</h3>

                        ${(entry.calories > 0 || entry.protein > 0) ? `
                        <div class="flex items-center gap-3 text-xs text-muted mt-2">
                            ${entry.calories > 0 ? `<span>約 ${entry.calories} 大卡</span>` : ''}
                            ${entry.protein > 0 ? `<span class="text-sage font-medium">蛋白質 ${entry.protein}g</span>` : ''}
                        </div>` : ''}

                        ${hasNotes ? `
                        <button onclick="toggleNote('${safeId}')" class="mt-3 pt-2.5 border-t border-stone-200/50 w-full flex items-center justify-between text-xs text-muted hover:text-ink transition">
                            <span class="flex items-center gap-1.5">
                                <i class="ph ph-sparkle text-sage"></i> 查看營養筆記
                            </span>
                            <i id="note-chevron-${safeId}" class="ph ph-caret-down chevron-icon"></i>
                        </button>
                        <div id="note-drawer-${safeId}" class="note-drawer">
                            <div>
                                <div class="mt-3 p-4 bg-surface rounded-2xl text-xs space-y-2 leading-relaxed text-ink/80">
                                    ${entry.analysis ? `<p><span class="font-semibold text-ink">營養觀察：</span>${entry.analysis}</p>` : ''}
                                    ${entry.advice ? `<p><span class="font-semibold text-sage">微調建議：</span>${entry.advice}</p>` : ''}
                                </div>
                            </div>
                        </div>` : ''}
                    </article>`;
                }
            });

            html += `</div></div>`;
        });

        container.innerHTML = html;
    }

    // ==========================================
    // 新增、刪除、匯入與備份
    // ==========================================
    function addWater() {
        const entry = {
            id: 'water_' + Date.now(),
            type: 'water',
            title: '喝水',
            amount: 250,
            timestamp: new Date().toISOString()
        };
        state.entries.unshift(entry);
        saveData();
        renderDashboard();
        renderTimeline();
        showToast('已喝水 +250ml');
    }

    function selectModalCategory(cat) {
        document.getElementById('entry-type').value = cat;
        document.getElementById('modal-title').textContent = `記錄${cat}`;
        document.querySelectorAll('.mcat-btn').forEach(btn => {
            if (btn.dataset.mcat === cat) {
                btn.className = 'mcat-btn text-xs px-3 py-1.5 rounded-full bg-ink text-paper font-medium transition';
            } else {
                btn.className = 'mcat-btn text-xs px-3 py-1.5 rounded-full bg-paper text-muted transition';
            }
        });
    }

    function openModal(type, category) {
        selectModalCategory(category || '午餐');
        document.getElementById('entry-content').value = '';
        document.getElementById('entry-context').value = '';
        document.getElementById('entry-cals').value = '';
        document.getElementById('entry-protein').value = '';
        const m = document.getElementById('entry-modal');
        m.classList.remove('hidden');
        setTimeout(() => {
            m.classList.remove('opacity-0');
            document.getElementById('entry-content').focus();
        }, 10);
    }

    async function saveEntry() {
        const category = document.getElementById('entry-type').value || '午餐';
        const content = document.getElementById('entry-content').value.trim();
        const context = document.getElementById('entry-context').value.trim();
        const cals = parseInt(document.getElementById('entry-cals').value) || 0;
        const protein = parseInt(document.getElementById('entry-protein').value) || 0;

        if (!content) {
            showToast('請輸入餐點內容', true);
            return;
        }

        const now = new Date();
        const entry = {
            id: 'meal_' + Date.now(),
            type: 'meal',
            category,
            title: content,
            context,
            calories: cals,
            protein,
            analysis: '',
            advice: '',
            timestamp: now.toISOString()
        };

        state.entries.unshift(entry);
        saveData();
        closeModal('entry-modal');
        renderDashboard();
        renderTimeline();
        renderChart();
        showToast(`已記錄${category}`);

        // 同步寫入雲端
        try {
            await db.collection('diet_records').doc(entry.id).set({
                type: entry.category,
                title: entry.title,
                context: entry.context,
                calories: entry.calories,
                protein: entry.protein,
                analysis: '',
                advice: '',
                createdAt: firebase.firestore.Timestamp.fromDate(now)
            });
        } catch (err) {
            console.error("雲端寫入失敗:", err);
        }
    }

    async function deleteEntry(id) {
        if (!confirm('要移除這筆紀錄嗎？')) return;
        state.entries = state.entries.filter(e => e.id !== id);
        saveData();
        renderDashboard();
        renderTimeline();
        renderChart();
        showToast('已移除紀錄');

        try {
            await db.collection('diet_records').doc(id).delete();
        } catch (error) {
            console.error("雲端刪除失敗:", error);
        }
    }

    function openDataModal() {
        const m = document.getElementById('data-modal');
        m.classList.remove('hidden');
        setTimeout(() => m.classList.remove('opacity-0'), 10);
    }

    async function handleTextImport() {
        const text = document.getElementById('import-text').value;
        if (!text.trim()) {
            showToast('請先貼上表格內容', true);
            return;
        }

        const batch = db.batch();
        let addedCount = 0;
        let updatedCount = 0;
        const lines = text.split('\n');

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
            if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);

            let row = [];
            if (cleanLine.includes('|')) {
                row = cleanLine.split('|').map(s => s.trim());
            } else {
                const parsed = Papa.parse(cleanLine);
                if (parsed.data && parsed.data.length > 0) row = parsed.data[0].map(s => s.trim());
            }

            if (row.length < 3) return;

            const dateMatch = row[0].match(/(\d{4}\/\d{2}\/\d{2})/);
            if (dateMatch) {
                const dateStr = dateMatch[1].replace(/\//g, '-');
                const fullDateString = row[0];
                let category = '點心/其他';
                let timeStr = '15:00';

                if (fullDateString.includes('早')) { category = '早餐'; timeStr = '08:00'; }
                else if (fullDateString.includes('午餐')) { category = '午餐'; timeStr = '12:30'; }
                else if (fullDateString.includes('晚餐')) { category = '晚餐'; timeStr = '19:00'; }
                else if (fullDateString.includes('宵夜')) { category = '宵夜'; timeStr = '23:00'; }

                const timestamp = new Date(`${dateStr}T${timeStr}:00`).toISOString();
                const context = row[1] || '';
                const content = row[2] || '未紀錄內容';
                let calories = 0, protein = 0, analysis = '', advice = '';

                if (row.length >= 7 && !isNaN(parseInt(row[3]))) {
                    calories = parseInt(row[3]) || 0;
                    protein = parseInt(row[4]) || 0;
                    analysis = row[5] || '';
                    advice = row[6] || '';
                } else {
                    analysis = row[3] || '';
                    advice = row[4] || '';
                }

                const newEntry = {
                    id: 'import_' + Date.now() + Math.random().toString(36).substring(7),
                    type: content.includes('水') && !content.includes('餃') && !content.includes('果') ? 'water' : 'meal',
                    category,
                    title: content,
                    context,
                    calories,
                    protein,
                    analysis,
                    advice,
                    timestamp
                };

                const firebaseData = {
                    type: newEntry.category,
                    title: newEntry.title,
                    context: newEntry.context,
                    calories: newEntry.calories,
                    protein: newEntry.protein,
                    analysis: newEntry.analysis,
                    advice: newEntry.advice,
                    createdAt: firebase.firestore.Timestamp.fromDate(new Date(newEntry.timestamp))
                };

                const existingIndex = state.entries.findIndex(e => e.timestamp.startsWith(dateStr) && e.category === category && e.type === 'meal');

                if (existingIndex !== -1 && newEntry.type === 'meal') {
                    newEntry.id = state.entries[existingIndex].id;
                    state.entries[existingIndex] = newEntry;
                    batch.set(db.collection('diet_records').doc(newEntry.id), firebaseData, { merge: true });
                    updatedCount++;
                } else {
                    batch.set(db.collection('diet_records').doc(newEntry.id), firebaseData);
                    state.entries.push(newEntry);
                    addedCount++;
                }
            }
        });

        if (addedCount > 0 || updatedCount > 0) {
            try {
                document.getElementById('import-text').value = '';
                await batch.commit();
                saveData();
                closeModal('data-modal');
                renderDashboard();
                renderTimeline();
                renderChart();
                showToast(`同步完成（新增 ${addedCount}、更新 ${updatedCount}）`);
            } catch (error) {
                console.error("寫入失敗:", error);
                showToast('同步失敗，請檢查網路', true);
            }
        } else {
            showToast('未讀取到有效的表格格式', true);
        }
    }

    function exportData() {
        const backupData = { meals: state.entries, scale: state.scaleData };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `diet_journal_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('已匯出備份檔案');
    }

    function handleJSONImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.meals) {
                    state.entries = importedData.meals;
                    state.scaleData = importedData.scale || [];
                } else if (Array.isArray(importedData)) {
                    state.entries = importedData;
                }
                saveData();
                localStorage.setItem('scale_entries_v2', JSON.stringify(state.scaleData));
                closeModal('data-modal');
                renderDashboard();
                renderScaleData();
                renderTimeline();
                renderChart();
                showToast('備份資料已還原');
            } catch (err) {
                showToast('檔案格式不正確', true);
            }
        };
        reader.readAsText(file);
    }

    function clearAllData() {
        if (confirm('確定要清空所有的手帳紀錄嗎？此操作無法還原。')) {
            state.entries = [];
            state.scaleData = [];
            saveData();
            localStorage.removeItem('scale_entries_v2');
            closeModal('data-modal');
            renderDashboard();
            renderScaleData();
            renderTimeline();
            renderChart();
            showToast('已清空歷史紀錄');
        }
    }

    function saveData() {
        localStorage.setItem('diet_entries_v4', JSON.stringify(state.entries));
    }

    function closeModal(modalId) {
        const m = document.getElementById(modalId);
        m.classList.add('opacity-0');
        setTimeout(() => m.classList.add('hidden'), 200);
    }

    ['entry-modal', 'data-modal', 'scale-modal'].forEach(id => {
        document.getElementById(id).addEventListener('click', (e) => {
            if (e.target.id === id) closeModal(id);
        });
    });
</script>
</body>
